<style>
/* Anmutung: Apples Feature-Zusammenfassungen nach Keynotes. Schwarzer Grund, große Schlagzeilen,
   Kacheln unterschiedlicher Breite, Einzelheiten hinter „+“ in einem Overlay. Text ≥ 7:1. */
:root{
  --bg:#000; --kachel:#141416; --kachel2:#1c1c1f; --linie:#2a2a2e;
  --text:#f5f5f7; --leise:#a8a8ad; --akzent:#ff8a2a; --akzent2:#d9531e;   /* Marsianer-Orange wie in der App */
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
main{max-width:1180px;margin:0 auto;padding:0 22px 80px}
.sprache{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;gap:4px;padding:10px 22px;background:rgba(0,0,0,.82);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px)}
.sprache button{background:none;border:0;color:var(--leise);font:inherit;font-size:13px;padding:4px 10px;border-radius:980px;cursor:pointer}
.sprache button.an{color:#000;background:var(--text)}
.held{text-align:center;padding:72px 0 40px}
.held h1{display:inline-flex;align-items:center;gap:.14em;font-size:calc(clamp(48px,9vw,112px) * var(--fit,1));line-height:1.04;letter-spacing:-.02em;font-weight:700;margin:0 0 10px;
  background:linear-gradient(90deg,var(--akzent),var(--akzent2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* Das Tresorrad der App, als Maske auf demselben Verlauf wie der Name */
.held h1 .rad{width:.9em;height:.9em;flex:0 0 auto;background:linear-gradient(90deg,var(--akzent),var(--akzent2));background-size:800% 100%;
  -webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cg%20transform='translate(32%2032)'%20stroke='%23fff'%20stroke-width='4'%20stroke-linecap='round'%20fill='none'%3E%3Ccircle%20r='22'/%3E%3Cg%20transform='rotate(15)'%3E%3Cpath%20d='M-22%200H22M0-22V22'/%3E%3C/g%3E%3C/g%3E%3Ccircle%20cx='32'%20cy='32'%20r='5'%20fill='%23fff'/%3E%3C/svg%3E") center/contain no-repeat;
  mask:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cg%20transform='translate(32%2032)'%20stroke='%23fff'%20stroke-width='4'%20stroke-linecap='round'%20fill='none'%3E%3Ccircle%20r='22'/%3E%3Cg%20transform='rotate(15)'%3E%3Cpath%20d='M-22%200H22M0-22V22'/%3E%3C/g%3E%3C/g%3E%3Ccircle%20cx='32'%20cy='32'%20r='5'%20fill='%23fff'/%3E%3C/svg%3E") center/contain no-repeat}
.held .spruch{font-size:clamp(28px,4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.01em;color:var(--text);margin:0 0 14px}
.held p{font-size:clamp(18px,2vw,22px);line-height:1.35;color:var(--leise);max-width:34em;margin:0 auto 40px;font-weight:500}
.held .bild{aspect-ratio:21/9;border-radius:28px}
.held .pdf{display:inline-block;margin:-22px 0 38px;color:var(--akzent);font-size:17px;font-weight:600;text-decoration:none}
.held .pdf:hover{text-decoration:underline}
.abschnitt{margin:120px 0 0}
.abschnitt>.kopf,.fahrt .kopf{max-width:820px;margin:0 0 36px}
.abschnitt>.kopf .augenbraue,.fahrt .kopf .augenbraue{font-size:17px;font-weight:600;color:var(--akzent);margin:0 0 8px}
.abschnitt>.kopf h2,.fahrt .kopf h2{font-size:clamp(34px,5vw,56px);line-height:1.07;letter-spacing:-.01em;font-weight:700;margin:0 0 14px}
.abschnitt>.kopf p,.fahrt .kopf p{font-size:clamp(18px,2vw,21px);color:var(--leise);margin:0;font-weight:500}
.raster{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.k{position:relative;grid-column:span 6;background:var(--kachel);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.k.w12{grid-column:span 12}.k.w8{grid-column:span 8}.k.w4{grid-column:span 4}.k.w6{grid-column:span 6}.k.w5{grid-column:span 5}.k.w7{grid-column:span 7}
/* EINE REIHE, EIN RASTER (Caspar_D, 27.10.2026: „die Bildunterkanten immer alignieren und die Überschriften der Unterschriften
   ebenfalls auf der gleichen Baseline“). Jede Kachel belegt zwei Zeilen des Seitenrasters und erbt sie (subgrid): Textzeile
   und Bildzeile sind fuer alle Kacheln einer Reihe gleich hoch. Bilder sitzen unten (align-self:end), Texte oben. */
.raster{grid-auto-rows:auto}
.k:not(.quer){display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:0}
.k:not(.quer) > *{min-width:0}
.k:not(.quer) > .text{align-self:start}
.k:not(.quer) > .bild{align-self:end;margin-top:0}
.k:not(.quer) > .bild.konsole{align-self:stretch}
.k:not(.quer) > .filterliste,.k:not(.quer) > .schaubild{align-self:end}
/* Grafik oben, Text darunter (Caspar_D, 27.10.2026: „immer nur den Grafikteil nehmen und einen Text drunterzusetzen“) */
/* Oben ein schwarzes Feld mit duennem Rahmen im Grau des Schriftfelds; die Grafik reicht von Rand zu Rand und steht unten
   auf der Teilungslinie, was darueber frei bleibt, bleibt schwarz (Caspar_D, 27.10.2026). Alle Felder einer Reihe gleich hoch. */
.k.oben > .bild{grid-row:2;align-self:stretch;aspect-ratio:auto!important;margin:0 3px 3px;border-radius:0 0 25px 25px;background:#000;
  display:flex;align-items:flex-end}
.k.oben > .bild img{width:100%;height:auto;object-fit:initial}
/* sichtbare Kante des schwarzen Feldes: zeigt, dass alle Felder einer Reihe gleich gross sind (Caspar_D, 27.10.2026) */
.k.oben > .bild{position:relative}
.k.oben > .bild::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.5px var(--kachel);pointer-events:none}
/* Hell nur beim Nachbarschafts-Diagramm (Caspar_D: „der sollte nur einmal beim Diagramm hell sein, ansonsten Hintergrundfarbe des Textpanels darüber“) */
.k[data-id=nachbar] > .bild::after{box-shadow:inset 0 0 0 1.5px #4a4a52}
.k.oben > .text{grid-row:1}
.k.oben .text{padding-bottom:22px}
/* das „+“ ins Schriftfeld, sonst verdeckt es die Achsenbeschriftung der Grafik */
.k.oben .plus{top:18px;bottom:auto}
.k .text{padding:30px 32px 26px}
.k .klein{font-size:15px;font-weight:600;color:var(--akzent);margin:0 0 6px}
.k h3{font-size:clamp(24px,2.6vw,32px);line-height:1.12;letter-spacing:-.005em;font-weight:700;margin:0 0 10px}
.k p{margin:0;color:var(--leise);font-size:17px;font-weight:500}
.k p b{color:var(--text);font-weight:600}
.k .zahl{display:block;margin:16px 0 0;font-size:40px;line-height:1;font-weight:700;color:var(--text);letter-spacing:-.01em}
.k .zahl small{display:block;font-size:14px;font-weight:600;color:var(--leise);margin-top:6px;letter-spacing:0}
.k .bild{margin-top:auto}
.bild{position:relative;aspect-ratio:16/10;background:var(--kachel2);overflow:hidden}
.k.w4 .bild{aspect-ratio:4/3}
.k.w12 .bild{aspect-ratio:21/9}
.bild img,.bild video{width:100%;height:100%;object-fit:cover;display:block}
.bild.geraete{aspect-ratio:16/11;background:radial-gradient(ellipse at 50% 110%,#3a200c 0%,var(--kachel2) 65%)}
/* Geraetegruppe (Apple-Trio): Laptop hinten Mitte, Tablet vorn links, Handy vorn rechts; schlichte Rahmen ohne Marke */
.geraete .lap{position:absolute;left:14%;top:7%;width:72%}
.geraete .schirm{background:#0b0b0c;border:solid #2a2a2d;border-width:8px 8px 11px;border-radius:12px 12px 0 0;aspect-ratio:16/10;overflow:hidden}
.geraete .fuss{height:9px;margin:0 -6%;background:linear-gradient(#3a3a3e,#1e1e20);border-radius:0 0 10px 10px}
.geraete .tab{position:absolute;left:5%;bottom:5%;height:66%;aspect-ratio:1640/2360;background:#0b0b0c;border:7px solid #2a2a2d;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.geraete .hand{position:absolute;right:7%;bottom:5%;height:52%;aspect-ratio:780/1688;background:#0b0b0c;border:5px solid #2a2a2d;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.geraete img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
@media screen and (max-width:820px){.geraete .schirm{border-width:5px 5px 7px;border-radius:8px 8px 0 0}.geraete .tab{border-width:4px;border-radius:10px}.geraete .hand{border-width:3px;border-radius:11px}}
.k .bild.konsole,.bild.konsole{aspect-ratio:auto;flex:1;min-height:220px;margin:0 22px 0;border-radius:12px 12px 0 0;background:#0a0a0b;border:1px solid #2c2c30;border-bottom:0}
.konsole .leiste{display:flex;align-items:center;gap:7px;padding:10px 12px;background:#18181b;border-bottom:1px solid #2c2c30}
.konsole .leiste i{width:11px;height:11px;border-radius:50%;background:#3a3a3e}
.konsole .leiste span{margin-left:auto;margin-right:auto;font-size:12px;color:#b0b0b5;transform:translateX(-27px)}
.konsole pre{margin:0;padding:14px 16px;font:calc(13px * var(--fit,1))/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#b9b9be;white-space:pre;overflow:hidden}
.konsole pre b{color:var(--akzent);font-weight:600}
.konsole pre u{text-decoration:none;color:#e6e6ea}
.schaubild{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;column-gap:22px;padding:6px 32px 34px}
/* Ueberschriften in EINER Zeile des Rasters: gleiche Grundlinie (Caspar_D, 27.10.2026) */
.schaubild .sk{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--akzent)}
.schaubild .l{text-align:right}
.schaubild .sl{font-size:17px;line-height:1.75;color:var(--text);align-self:center}
.schaubild .sl i{font-style:normal;color:var(--leise)}
.schaubild .sm{display:grid;grid-template-columns:56px auto 56px;align-items:center;align-self:center;row-gap:8px}
.schaubild .sm i{height:1px;background:linear-gradient(90deg,transparent,#e31c79)}
.schaubild .sm i:last-of-type{background:linear-gradient(90deg,#e31c79,transparent)}
.schaubild .knopf{width:80px;height:80px;border-radius:50%;border:1.5px solid #e31c79aa;background:#e31c7922;display:grid;place-items:center}
.schaubild .knopf svg{width:38px;height:38px;fill:#e31c79}
.schaubild .sm b{grid-column:2;text-align:center;color:#ff7fb3;font-size:13px;font-weight:600}
@media screen and (max-width:820px){.schaubild{padding:4px 16px 26px;column-gap:10px}.schaubild .sl{font-size:14px;line-height:1.6}.schaubild .sm{grid-template-columns:18px auto 18px}.schaubild .knopf{width:56px;height:56px}.schaubild .knopf svg{width:26px;height:26px}}
/* Querkachel: Text links, Bild rechts */
.k.quer{flex-direction:row;align-items:stretch}
.k.quer .text{flex:0 0 34%;align-self:center}
.k.quer .bild{flex:1;margin-top:0}
@media screen and (max-width:820px){.k.quer{flex-direction:column}.k.quer .text{flex:none}}
.filterliste{padding:4px 32px 30px;margin-top:auto}
.filterliste .fk{margin:16px 0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--akzent)}
.filterliste .fw{margin:0;font-size:16px;line-height:1.55;color:var(--text)}
.bild.trip{display:flex;justify-content:center;align-items:center;gap:4%;padding:5% 6% 0;aspect-ratio:21/11;background:radial-gradient(ellipse at 50% 120%,#3a2410 0%,var(--kachel2) 70%)}
.bild.trip img{width:auto;height:100%;max-width:28%;object-fit:contain;border-radius:22px 22px 0 0;border:6px solid #2b2b2e;border-bottom:0;box-shadow:0 0 0 1px #3a3a3e}
@media screen and (max-width:820px){.bild.trip{aspect-ratio:4/3;gap:3%;padding:6% 3% 0}.bild.trip img{border-radius:14px 14px 0 0;border-width:4px}}
.bild .platz{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--leise);font-size:14px;border:1px dashed #3a3a40;border-radius:16px}
.plus{position:absolute;right:18px;bottom:18px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(66,66,69,.78);backdrop-filter:blur(10px);color:var(--text);cursor:pointer;display:grid;place-items:center}
.plus svg{width:14px;height:14px}
.plus:hover{background:rgba(90,90,94,.9)}
.k .druck{display:none}
/* Leicht gedimmt; das Fenster geht am Plus auf, sein Kreuz liegt dort, wo das Plus war (Lage setzt lage()). */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;overflow:auto}
.overlay.auf{display:block}
.abspielen{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:3;border:0;border-radius:50%;background:rgba(20,20,22,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);cursor:pointer;display:grid;place-items:center}
.abspielen svg{width:28px;height:28px;margin-left:3px}
.fahrt .fbild > .abspielen{inset:auto;left:50%;top:50%;width:64px;height:64px;display:grid}
/* Fahrt (Scrollytelling): Die Kachel bleibt stehen, das Scrollen führt dasselbe Bild durch seine Stufen
   (Cover → Tiefenkarte → Clip), danach scrollt die Seite weiter. Ohne Bewegungswunsch und im Druck: die Einzelkacheln. */
.fahrt{display:none;grid-column:span 12;height:calc(var(--n) * 100svh)}
@media screen and (prefers-reduced-motion:no-preference){.fahrt{display:block}.k.in-fahrt{display:none}.mit-fahrt>.kopf{display:none}
  /* Steht eine Nachbarkachel nach der Fahrt allein, nimmt sie die volle Breite, ihre Liste läuft in Spalten. */
  .k.fahrt-w12{grid-column:span 12}.k.fahrt-w8{grid-column:span 8}
  /* Zimmer neben dem Skizzenbuch: etwas höher als sein Bild – seitlich anschneiden statt Streifen (Lampe links bleibt) */
  .k.fahrt-w8 > .bild img{height:100%;object-fit:cover;object-position:30% 50%}.k.fahrt-w12 > .filterliste{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));column-gap:28px}}
.fahrt .halt{position:sticky;top:64px}   /* top setzt fahren(): Kachel mittig unter der Sprachleiste; unten schließt sie bündig ab */
.fahrt .buehne{position:relative;width:100%;display:flex;background:var(--kachel);border-radius:28px;overflow:hidden}
.fahrt .ftext{flex:1;padding:30px 32px 26px;display:flex;flex-direction:column}
.fahrt .schritte{font-size:15px;font-weight:600;color:var(--leise);margin:0 0 6px;padding-right:44px}
.fahrt .schritte span{transition:color .3s;white-space:nowrap}
.fahrt .schritte span.an{color:var(--akzent)}
.fahrt .schritte i{font-style:normal;color:#55555a}
.fahrt .stufen{display:grid}
.fahrt .stufe{grid-area:1/1;opacity:0;transition:opacity .35s}
.fahrt .stufe.an{opacity:1}
.fahrt .stufe h3{font-size:clamp(24px,2.6vw,32px);line-height:1.12;letter-spacing:-.005em;font-weight:700;margin:0 0 10px}
.fahrt .stufe p{margin:0;color:var(--leise);font-size:17px;font-weight:500}
.fahrt .plus{top:18px;right:18px;bottom:auto}
.fahrt .fbild{position:relative;flex:0 0 auto;width:min(64%,calc(var(--bildhoehe,600px) * var(--seite)));aspect-ratio:var(--seite);margin:3px;border-radius:25px;overflow:hidden;background:#000}
.fahrt .fbild > *{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fahrt .fbild .welt{overflow:hidden}
.fahrt .welt img{position:absolute;display:block;max-width:none}
.fahrt .welt .nah{opacity:0}
.fahrt .fbild .linie{inset:auto;left:0;width:100%;height:2px;background:var(--akzent);box-shadow:0 0 12px var(--akzent);opacity:0}
/* Gestapelt nur im Hochformat; ein Handy quer bekommt Text neben dem Bild, sonst steht das Bild allein unter dem Text */
@media screen and (max-width:820px) and (orientation:portrait){
  .fahrt .buehne{flex-direction:column}
  .fahrt .ftext{padding:22px 22px 18px}
  .fahrt .fbild{width:min(100% - 6px,calc(var(--bildhoehe,600px) * var(--seite)));align-self:center}
}
.fenster{position:absolute;max-width:640px;width:calc(100% - 32px);box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 0 1px var(--linie);background:var(--kachel2);border-radius:28px;padding:48px 48px 40px}
.fenster .klein{font-size:15px;font-weight:600;color:var(--akzent);margin:0 0 6px}
.fenster h4{font-size:clamp(26px,3vw,36px);line-height:1.12;font-weight:700;margin:0 0 22px}
.fenster ul{margin:0;padding:0;list-style:none}
.fenster li{padding:14px 0;border-top:1px solid var(--linie);color:#b4b4b9;font-size:17px}
.fenster li b{color:var(--text);font-weight:600}
.fenster .zu{position:absolute;right:18px;top:18px;width:36px;height:36px;border-radius:50%;border:0;background:#333336;color:var(--text);cursor:pointer;display:grid;place-items:center}
.fenster .zu svg{width:12px;height:12px}
.grenzen{margin:120px 0 0;border-top:1px solid var(--linie);padding-top:28px}
.grenzen h2{font-size:24px;font-weight:700;margin:0 0 12px}
.grenzen ul{margin:0;padding-left:20px;color:var(--leise);font-size:15px}
.grenzen li{margin:0 0 6px}
h1,h2,h3,h4{text-wrap:balance}
.k p,.held p,.kopf p,.fenster li,.grenzen li{text-wrap:pretty}
/* Soundtrack: vier Songs, je Kachel das erste Bild des Bewegtbild-Covers, verlinkt zu Suno */
.lieder .liste{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.lieder .lied{display:block;background:var(--kachel);border-radius:28px;padding:16px 16px 22px;color:var(--text);text-decoration:none}
.lieder .lied img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block;margin-bottom:16px}
.lieder .stil{display:block;font-size:14px;font-weight:600;color:var(--akzent);margin:0 4px 4px}
.lieder b{display:block;font-size:19px;line-height:1.2;font-weight:700;margin:0 4px}
.lieder .hoeren{display:block;margin:8px 4px 0;font-size:14px;color:var(--leise)}
.lieder .lied:hover .hoeren{color:var(--text)}
@media screen and (max-width:1100px){.lieder .liste{grid-template-columns:1fr 1fr}}
@media screen and (max-width:480px){.lieder .liste{gap:12px}.lieder .lied{padding:10px 10px 16px;border-radius:20px}.lieder b{font-size:16px}}
footer{margin:40px 0 0;color:var(--leise);font-size:13px}
footer a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--leise)}
footer a:hover{color:var(--akzent);border-color:var(--akzent)}
@media screen and (max-width:820px){
  .raster{gap:14px}
  .k,.k.w4,.k.w5,.k.w6,.k.w7,.k.w8{grid-column:span 12}
  .k .text{padding:26px 24px 22px}
  .held{padding:48px 0 28px}
  .held h1{font-size:calc((100vw - 48px) / 6.5 * var(--fit,1))}
  .held .bild{aspect-ratio:4/3;border-radius:22px}
  .abschnitt{margin-top:84px}
  .k.w12 .bild{aspect-ratio:4/3}
  .fenster{padding:44px 24px 28px}
  .k h3{padding-right:40px}
  .grenzen{margin-top:84px}
  .filterliste{padding-bottom:64px}
}
@media screen and (max-width:480px){
  .schaubild{grid-template-columns:1fr;row-gap:14px;padding-bottom:64px}
  .schaubild .l,.schaubild .r{text-align:left}
  .schaubild .sm{justify-self:center}
}
/* Zwei Paare mit Liste daneben: unter 1100 px wird die Liste so hoch, dass ueber dem Bild ein schwarzes Band entsteht */
@media screen and (max-width:1100px) and (min-width:821px){
  .k[data-id=messdaten],.k[data-id=messliste],.k[data-id=effektclip],.k[data-id=rezept],.k[data-id=uebersicht],.k[data-id=filtern]{grid-column:span 12}
}
@media (pointer:coarse){.sprache button{min-height:44px;min-width:44px}}
@media print{
  /* Druck (Caspar_D, 28.10.2026): A4, ein Satzspiegel mit Rand zum Atmen; Schrift auf zwei Dritteln der Breite,
     Bilder ueber die ganze Satzbreite. Dieselbe Seite, nur anders gesetzt. Der Rand liegt als Innenabstand auf main
     und wiederholt sich je Seite (clone), damit er schwarz bleibt statt weiss wie ein @page-Rand. */
  @page{size:A4;margin:0}
  html,body{background:#000}
  body{font-size:10.5pt;line-height:1.45}
  main{max-width:none;padding:18mm 20mm 16mm;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .sprache,.plus,.overlay,.held .pdf,.lieder{display:none!important}
  /* Kopf */
  .held{padding:0 0 6mm;text-align:left}
  .held h1{font-size:30pt;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--akzent)}
  .held .spruch{font-size:20pt}
  .held p{font-size:12pt;max-width:66.6%;margin:0 0 6mm}
  .held .bild{aspect-ratio:21/9;border-radius:3mm}
  /* Abschnitte: Ueberschrift beginnt eine neue Seite nur, wenn sie sonst allein unten stuende */
  .abschnitt{margin:12mm 0 0;break-before:auto}
  .abschnitt>.kopf{max-width:66.6%;margin:0 0 6mm;break-inside:avoid;break-after:avoid}
  .abschnitt>.kopf .augenbraue{font-size:10pt}
  .abschnitt>.kopf h2{font-size:24pt}
  .abschnitt>.kopf p{font-size:12pt}
  /* Kacheln untereinander, ohne Kachelflaeche: Text, darunter das Bild */
  .raster{display:block}
  .k,.k.quer,.k:not(.quer){display:block;background:none;border-radius:0;overflow:visible;margin:0 0 9mm;break-inside:avoid}
  .k .text,.k.oben .text,.k.quer .text{max-width:66.6%;padding:0 0 3.5mm}
  .k .klein{font-size:9.5pt;margin:0 0 1mm}
  .k h3{font-size:15pt;margin:0 0 1.5mm}
  .k p{font-size:10.5pt}
  .k .zahl{font-size:22pt;margin:3mm 0 0}
  .k .druck{display:block;margin:2.5mm 0 0;padding:0 0 0 4mm;color:var(--leise);font-size:9.5pt}
  .k .druck li{margin:0 0 1mm}
  .k .druck b{color:var(--text)}
  /* Bilder: volle Satzbreite in ihrem eigenen Format; hohe Bilder hoechstens 110 mm hoch, damit Text und Bild meist zu zweit auf eine Seite passen */
  .k .bild,.k.oben > .bild,.k.w4 .bild,.k.w12 .bild{aspect-ratio:auto!important;margin:0;border-radius:3mm;background:none;display:block}
  .k.oben > .bild::after{display:none}
  .k .bild img,.k .bild video{width:100%;height:auto;max-height:110mm;width:auto;max-width:100%;object-fit:contain;object-position:left top;border-radius:3mm}
  .k .bild.trip,.k .bild.geraete{aspect-ratio:21/11!important}
  .k .bild.konsole{min-height:0;margin:0;max-width:66.6%;border-radius:2mm;border:1px solid #2c2c30}
  .konsole pre{font-family:Menlo,Consolas,monospace;font-size:8.5pt}
  .filterliste,.schaubild{padding:0;max-width:100%}
  .grenzen{margin:12mm 0 0;break-inside:avoid}
  footer{break-before:avoid}
}
</style>
<link rel="icon" href="data:,">

<body>
<nav class="sprache" aria-label="Language">
  <button data-l="en">EN</button><button data-l="de">DE</button><button data-l="ru">RU*</button>
</nav>
<main id="seite"></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="fenster" id="fenster"></div></div>
<script src="inhalt.js"></script>
<script>
const PLUS = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg>';
const KREUZ = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l10 10M11 1L1 11"/></svg>';

function spracheWaehlen(){
  try { const s = localStorage.getItem('kt-features-sprache'); if (s && S.kopf.h[s]) return s; } catch(e){}
  const q = new URLSearchParams(location.search).get('lang'); if (q && S.kopf.h[q]) return q;
  for (const l of (navigator.languages || [navigator.language || 'en'])) { const k = (l||'').slice(0,2); if (S.kopf.h[k]) return k; }
  return 'en';
}
function bild(id, L){
  let q = BILDER[id];
  if (q && q.sprachen) q = q.sprachen[L] || q.sprachen.en;   /* Bild je Sprache, sonst Englisch */
  if (q && q.schaubild){ const g = q.schaubild;
    return `<div class="schaubild"><p class="sk l">${g.links[L]}</p><span></span><p class="sk r">${g.rechts[L]}</p>`
      + `<div class="sl l">${g.von[L].join('<br>')}</div>`
      + `<div class="sm"><i></i><div class="knopf"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></div><i></i><b>${g.knopf[L]}</b></div>`
      + `<div class="sl r">${g.bei[L].join('<br>')}</div></div>`; }
  if (q && q.liste) return `<div class="filterliste">${q.liste.map(g => `<div><p class="fk">${g.k[L]}</p><p class="fw">${g.w[L].join(' · ')}</p></div>`).join('')}</div>`;
  if (q && q.konsole) return `<div class="bild konsole"><div class="leiste"><i></i><i></i><i></i><span>KlangTresor</span></div><pre>${konsole(L).map(z => z.replace(/^  (KlangTresor (läuft|is running|работает))$/, '  <b>$1</b>').replace(/http:\/\/[^ ]+/g, '<u>$&</u>')).join('\n')}</pre></div>`;
  if (q && q.geraete){ const g = q.geraete;
    return `<div class="bild geraete"><div class="lap"><div class="schirm"><img src="${g.laptop}" alt=""></div><div class="fuss"></div></div>`
      + `<div class="tab"><img src="${g.tablet}" alt=""></div><div class="hand"><img src="${g.handy}" alt=""></div></div>`; }
  if (Array.isArray(q)) return `<div class="bild trip">${q.map(u => `<img src="${u}" alt="" loading="lazy">`).join('')}</div>`;
  if (!q) return `<div class="bild"><div class="platz">${S.kopf.platz[L]} · ${id}</div></div>`;
  if (/\.mp4(\?|$)/.test(q)) return `<div class="bild"><video src="${q}"${POSTER[id] ? ` poster="${POSTER[id]}"` : ''} autoplay muted loop playsinline data-tempo="${TEMPO[id] || 1}" onloadedmetadata="this.defaultPlaybackRate=this.playbackRate=+this.dataset.tempo"></video></div>`;
  return `<div class="bild"${FORMAT[id] ? ` style="aspect-ratio:${FORMAT[id]}"` : ''}><img src="${q}" alt="" loading="lazy"></div>`;
}
let L, KACHELN = {};
function bauen(){
  document.documentElement.lang = L;
  document.querySelectorAll('.sprache button').forEach(b => b.classList.toggle('an', b.dataset.l === L));
  KACHELN = {};
  let h = `<section class="held"><h1><span class="rad" aria-hidden="true"></span>${S.kopf.marke[L]}</h1><p class="spruch">${S.kopf.h[L]}</p><p>${S.kopf.p[L]}</p><a class="pdf" href="KlangTresor-Broschuere-${L}.pdf">${S.kopf.pdf[L]} <span aria-hidden="true">↓</span></a>${bild('titel', L)}</section>`;
  for (const a of S.abschnitte){
    const kopf = `<div class="kopf"><p class="augenbraue">${a.augenbraue[L]}</p><h2>${a.h[L]}</h2><p>${a.p[L]}</p></div>`;
    h += `<section class="abschnitt${a.fahrt ? ' mit-fahrt' : ''}">${kopf}<div class="raster">`;
    if (a.fahrt && !a.fahrtNach) h += fahrt(a, kopf);
    for (const k of a.kacheln){
      KACHELN[k.id] = k;
      const zahl = k.zahl ? `<span class="zahl">${k.zahl.n}<small>${k.zahl.t[L]}</small></span>` : '';
      h += `<article class="k w${k.w}${k.quer ? ' quer' : ''}${k.oben ? ' oben' : ''}${a.fahrt && a.fahrt.includes(k.id) ? ' in-fahrt' : ''}${k.wFahrt ? ' fahrt-w' + k.wFahrt : ''}" data-id="${k.id}"><div class="text"><p class="klein">${k.klein[L]}</p><h3>${k.h[L]}</h3><p>${k.p[L]}</p>${zahl}<ul class="druck">${k.d[L].map(x => `<li>${x}</li>`).join('')}</ul></div>
        ${NUR_TEXT.has(k.id) ? '' : bild(k.id, L)}
        <button class="plus" data-k="${k.id}" aria-label="${S.kopf.mehr[L]}">${PLUS}</button></article>`;
      if (a.fahrtNach === k.id) h += fahrt(a, kopf);
    }
    h += `</div></section>`;
  }
  { const g = S.lieder;
    h += `<section class="abschnitt lieder"><div class="kopf"><p class="augenbraue">${g.augenbraue[L]}</p><h2>${g.h[L]}</h2><p>${g.p[L]}</p></div><div class="liste">${
      g.liste.map(x => `<a class="lied" href="${x.url}" target="_blank" rel="noopener"><img src="${x.bild}?v=${BV}" alt=""><span class="stil">${x.stil[L]} · ${x.dauer}</span><b>${x.t}</b><span class="hoeren">${g.hoeren[L]} ↗</span></a>`).join('')}</div></section>`; }
  h += `<section class="grenzen"><h2>${S.grenzen.h[L]}</h2><ul>${S.grenzen.l[L].map(x => `<li>${x}</li>`).join('')}</ul></section>`;
  h += `<footer>${ghLink(S.fuss[L])}${S.stern[L] ? `<br>${S.stern[L]}` : ''}</footer>`;
  document.getElementById('seite').innerHTML = h;
  einpassen(); fahrtMasse(); fahren();
  document.querySelectorAll('#seite video[autoplay]').forEach(anstossen);
}
function fahrt(a, kopf){
  const ks = a.fahrt.map(id => a.kacheln.find(k => k.id === id)), art = a.fahrtArt || 'wandel';
  const q = id => bild(id, L).match(/src="([^"]+)"/)[1];   // Bildpfad wie in der Kachel, je Sprache
  const medien = art === 'zoom'
    ? `<div class="welt"><img class="ganz" src="${q(ks[0].id)}" alt=""><img class="nah" src="${q(ks[1].id)}" alt=""></div>`
    : `<img src="${q(ks[0].id)}" alt=""><img src="${q(ks[1].id)}" alt=""><video src="${BILDER[ks[2].id]}" poster="${q(ks[0].id)}" muted loop playsinline preload="auto"></video><span class="linie"></span>`;
  return `<div class="fahrt" data-art="${art}" data-ids="${a.fahrt.join(' ')}" style="--n:${ks.length + 0.4};--seite:${art === 'zoom' ? ZOOM.seite : 1180 / 982}"><div class="halt">${kopf}<div class="buehne">
    <div class="ftext"><p class="schritte">${ks.map((k, i) => `<span data-i="${i}">${k.klein[L]}</span>`).join(' <i>·</i> ')}</p>
      <div class="stufen">${ks.map((k, i) => `<div class="stufe" data-i="${i}"><h3>${k.h[L]}</h3><p>${k.p[L]}</p></div>`).join('')}</div></div>
    <div class="fbild">${medien}</div>
    <button class="plus" data-k="${ks[0].id}" aria-label="${S.kopf.mehr[L]}">${PLUS}</button></div></div></div>`;
}
// Wandel (Gestalten): Bild → Tiefenkarte wird von oben nach unten gewischt (beide Stufen Kante an Kante, man sieht, dass
// sie aufeinanderliegen); Tiefenkarte → Clip wird überblendet, das Bild „erwacht“, der Clip läuft erst nach der Blende los.
const WISCH = [[0.24, 0.40], [0.58, 0.74]];
const UEBERGANG = ['wisch', 'blende'];
// Zoom (Plakat): Lage des Ausschnitts im Plakat, als Anteil von Breite und Höhe. Gemessen per Kreuzkorrelation
// (0,998, in DE/EN/RU gleich): x 0, y 1466, 1386 × 1326 von 4000 × 2862 Plakatpixeln.
const ZOOM = { seite: 4000 / 2862, nah: { x: 0, y: 1466 / 2862, w: 1386 / 4000, h: 1326 / 2862 }, fahrt: [0.18, 0.78], blende: [0.62, 0.84] };
const glatt = t => t * t * (3 - 2 * t);
function fahren(){ document.querySelectorAll('.fahrt').forEach(fahre); }
function fahre(f){
  if (!f.offsetParent) return;
  const r = f.getBoundingClientRect(), halt = f.querySelector('.halt');
  const leiste = document.querySelector('.sprache').offsetHeight;
  const rest = innerHeight - leiste - halt.offsetHeight;   // passt alles: mittig; sonst unten bündig, Überschrift ragt oben hinaus
  const oben = Math.round(rest >= 24 ? leiste + rest / 2 : innerHeight - halt.offsetHeight - 12);   // ab hier steht die Kachel
  halt.style.top = oben + 'px';
  const p = Math.min(1, Math.max(0, (oben - r.top) / (r.height - halt.offsetHeight)));
  const stufe = f.dataset.art === 'zoom' ? zoomen(f, p) : wandeln(f, p);
  f.querySelectorAll('.schritte span, .stufe').forEach(e => e.classList.toggle('an', +e.dataset.i === stufe));
  f.querySelector('.plus').dataset.k = f.dataset.ids.split(' ')[stufe];
}
function wandeln(f, p){
  const ebenen = f.querySelectorAll('.fbild > img, .fbild > video'), linie = f.querySelector('.linie');
  let stufe = 0, linieX = null;
  WISCH.forEach(([a, b], i) => {
    const w = Math.min(1, Math.max(0, (p - a) / (b - a)));
    if (UEBERGANG[i] === 'blende') ebenen[i + 1].style.opacity = w.toFixed(3);
    else ebenen[i + 1].style.clipPath = `inset(0 0 ${(100 - w * 100).toFixed(2)}% 0)`;
    if (w > 0 && w < 1 && UEBERGANG[i] === 'wisch') linieX = w;
    if (w >= 0.5) stufe = i + 1;
  });
  linie.style.opacity = linieX === null ? 0 : 1;
  if (linieX !== null) linie.style.top = `calc(${(linieX * 100).toFixed(2)}% - 1px)`;
  const v = ebenen[2];
  if (p >= WISCH[1][1]) { if (v.paused && !v.dataset.steht) { v.currentTime = 0; anstossen(v); } }
  else { if (!v.paused || v.currentTime) { v.pause(); v.currentTime = 0; } knopfWeg(v); }
  return stufe;
}
// Kamera als Ausschnitt des Plakats (Anteile; der Rahmen hat das Seitenverhältnis des Plakats). Gezoomt wird geometrisch
// um den Fixpunkt beider Ausschnitte, so wirkt die Fahrt gleichmäßig. Ziel: so breit wie der Ausschnitt, unten bündig mit ihm
// (dort steht das Werkverzeichnis). Kurz vor dem Ziel blendet der hochaufgelöste Ausschnitt über.
function zoomen(f, p){
  const n = ZOOM.nah, [a, b] = ZOOM.fahrt, t = glatt(Math.min(1, Math.max(0, (p - a) / (b - a))));
  const w1 = n.w, y1 = n.y + n.h - w1, fy = y1 / (1 - w1);   // Ziel (x 0, y1, w1) und Fixpunkt (0, fy)
  const k = Math.pow(w1, t), y = fy * (1 - k);
  const setze = (el, x0, y0, bw, bh) => { const s = el.style;
    s.left = ((x0 - 0) / k * 100).toFixed(3) + '%'; s.top = ((y0 - y) / k * 100).toFixed(3) + '%';
    s.width = (bw / k * 100).toFixed(3) + '%'; s.height = (bh / k * 100).toFixed(3) + '%'; };
  setze(f.querySelector('.ganz'), 0, 0, 1, 1);
  const nah = f.querySelector('.nah'); setze(nah, n.x, n.y, n.w, n.h);
  nah.style.opacity = glatt(Math.min(1, Math.max(0, (p - ZOOM.blende[0]) / (ZOOM.blende[1] - ZOOM.blende[0])))).toFixed(3);
  return t >= 0.5 ? 1 : 0;
}
// iPhones im Stromsparmodus spielen Videos nicht von selbst ab. Dann steht das Standbild da, mit einem Knopf; ein Tipp startet.
function anstossen(v){
  const p = v.play();
  if (p) p.then(() => knopfWeg(v)).catch(() => {
    v.dataset.steht = 1;
    if (!v.parentElement.querySelector('.abspielen'))
      v.insertAdjacentHTML('afterend', `<button class="abspielen" aria-label="${S.kopf.abspielen[L]}"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>`);
  });
}
function knopfWeg(v){ delete v.dataset.steht; v.parentElement.querySelector('.abspielen')?.remove(); }
// Überschrift und Kachel stehen gemeinsam (der Abstand bleibt konstant). Das Bild richtet sich nach der Kachel allein;
// ist der Schirm für beides zu niedrig, scrollt die Überschrift hinaus und die Kachel bleibt ganz sichtbar.
function fahrtMasse(){ document.querySelectorAll('.fahrt').forEach(f => {
  if (!f.offsetParent) return;
  const leiste = document.querySelector('.sprache').offsetHeight;
  const schmal = matchMedia('(max-width:820px) and (orientation:portrait)').matches;
  const frei = innerHeight - leiste - 24 - 6 - (schmal ? f.querySelector('.ftext').offsetHeight : 0);
  f.style.setProperty('--bildhoehe', Math.max(160, frei) + 'px');
}); }
let fahrtRuht = true;
addEventListener('scroll', () => { if (fahrtRuht) { fahrtRuht = false; requestAnimationFrame(() => { fahrtRuht = true; fahren(); }); } }, { passive: true });
addEventListener('resize', () => { fahrtMasse(); fahren(); });
// Titel füllt die Spalte; die Servermeldung zeigt überall denselben Ausschnitt.
function einpassen(){
  // Titel: füllt die Breite, wird aber nie breiter als die Spalte (Schriftbreite schwankt je Gerät).
  const h1 = document.querySelector('.held h1');
  if (h1){ h1.style.setProperty('--fit', 1); const f = h1.parentElement.clientWidth / h1.getBoundingClientRect().width;
    if (f < 1) h1.style.setProperty('--fit', (Math.floor(f * 100) / 100).toFixed(2)); }
  // Servermeldung: auf schmaleren Kacheln derselbe Ausschnitt wie auf dem großen Schirm (dort 22 em Text breit), nur kleiner.
  for (const pre of document.querySelectorAll('.konsole pre')){
    const f = Math.min(1, (pre.clientWidth - 32) / (22 * 13));
    pre.style.setProperty('--fit', (Math.floor(f * 100) / 100).toFixed(2));
  }
}
addEventListener('resize', einpassen);
let knopf = null;
function auf(id, plus){
  knopf = plus;
  const k = KACHELN[id]; if (!k) return;
  document.getElementById('fenster').innerHTML = `<button class="zu" aria-label="${S.kopf.zu[L]}">${KREUZ}</button>
    <p class="klein">${k.klein[L]}</p><h4>${k.h[L]}</h4><ul>${k.d[L].map(x => `<li>${x}</li>`).join('')}</ul>`;
  document.getElementById('overlay').classList.add('auf');
  document.body.style.overflow = 'hidden';
  lage();
  try { document.querySelector('#fenster .zu').focus({ preventScroll: true }); } catch (e) {}
}
function lage(){
  const o = document.getElementById('overlay'), f = document.getElementById('fenster');
  if (!knopf || !o.classList.contains('auf')) return;
  const r = knopf.getBoundingClientRect(), z = f.querySelector('.zu'), W = o.clientWidth, H = o.clientHeight, m = 16;
  f.style.left = f.style.top = '0px';
  const w = f.offsetWidth, h = f.offsetHeight, zr = f.offsetWidth - z.offsetLeft - z.offsetWidth, zt = z.offsetTop;
  const x = Math.max(m, Math.min(r.right + zr - w, W - m - w));
  const y = Math.max(m, Math.min(r.top - zt, H - m - h));
  f.style.left = x + 'px'; f.style.top = y + 'px';
}
addEventListener('resize', lage);
function zu(){ document.getElementById('overlay').classList.remove('auf'); document.body.style.overflow = ''; }
document.addEventListener('click', e => {
  const p = e.target.closest('.plus'); if (p) return auf(p.dataset.k, p);
  const ab = e.target.closest('.abspielen');
  if (ab){ const v = ab.parentElement.querySelector('video'); knopfWeg(v); v.play().catch(() => {}); return; }
  if (e.target.closest('.zu') || e.target.id === 'overlay') zu();
  const b = e.target.closest('.sprache button');
  if (b){ L = b.dataset.l; try { localStorage.setItem('kt-features-sprache', L); } catch(e){} bauen(); }
});
addEventListener('keydown', e => { if (e.key === 'Escape') zu(); });
L = spracheWaehlen(); bauen();
</script>
