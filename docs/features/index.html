<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KlangTresor features</title>
<style>
/* Anmutung: Apples Feature-Zusammenfassungen nach Keynotes. Schwarzer Grund, große Schlagzeilen,
   Kacheln unterschiedlicher Breite, Einzelheiten hinter „+“ in einem Overlay. Text ≥ 7:1. */
:root{
  --bg:#000; --kachel:#141416; --kachel2:#1c1c1f; --linie:#2a2a2e;
  --text:#f5f5f7; --leise:#a8a8ad; --akzent:#ff8a2a; --akzent2:#d9531e;   /* Marsianer-Orange wie in der App */
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
main{max-width:1180px;margin:0 auto;padding:0 22px 80px}
.sprache{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;gap:4px;padding:10px 22px;background:rgba(0,0,0,.82);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px)}
.sprache button{background:none;border:0;color:var(--leise);font:inherit;font-size:13px;padding:4px 10px;border-radius:980px;cursor:pointer}
.sprache button.an{color:#000;background:var(--text)}
.held{text-align:center;padding:72px 0 40px}
.held h1{display:inline-flex;align-items:center;gap:.14em;font-size:clamp(48px,9vw,112px);line-height:1.04;letter-spacing:-.02em;font-weight:700;margin:0 0 10px;
  background:linear-gradient(90deg,var(--akzent),var(--akzent2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* Das Tresorrad der App, als Maske auf demselben Verlauf wie der Name */
.held h1 .rad{width:.9em;height:.9em;flex:0 0 auto;background:linear-gradient(90deg,var(--akzent),var(--akzent2));background-size:800% 100%;
  -webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cg%20transform='translate(32%2032)'%20stroke='%23fff'%20stroke-width='4'%20stroke-linecap='round'%20fill='none'%3E%3Ccircle%20r='22'/%3E%3Cg%20transform='rotate(15)'%3E%3Cpath%20d='M-22%200H22M0-22V22'/%3E%3C/g%3E%3C/g%3E%3Ccircle%20cx='32'%20cy='32'%20r='5'%20fill='%23fff'/%3E%3C/svg%3E") center/contain no-repeat;
  mask:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cg%20transform='translate(32%2032)'%20stroke='%23fff'%20stroke-width='4'%20stroke-linecap='round'%20fill='none'%3E%3Ccircle%20r='22'/%3E%3Cg%20transform='rotate(15)'%3E%3Cpath%20d='M-22%200H22M0-22V22'/%3E%3C/g%3E%3C/g%3E%3Ccircle%20cx='32'%20cy='32'%20r='5'%20fill='%23fff'/%3E%3C/svg%3E") center/contain no-repeat}
.held .spruch{font-size:clamp(28px,4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.01em;color:var(--text);margin:0 0 14px}
.held p{font-size:clamp(18px,2vw,22px);line-height:1.35;color:var(--leise);max-width:34em;margin:0 auto 40px;font-weight:500}
.held .bild{aspect-ratio:21/9;border-radius:28px}
.abschnitt{margin:120px 0 0}
.abschnitt>.kopf{max-width:820px;margin:0 0 36px}
.abschnitt>.kopf .augenbraue{font-size:17px;font-weight:600;color:var(--akzent);margin:0 0 8px}
.abschnitt>.kopf h2{font-size:clamp(34px,5vw,56px);line-height:1.07;letter-spacing:-.01em;font-weight:700;margin:0 0 14px}
.abschnitt>.kopf p{font-size:clamp(18px,2vw,21px);color:var(--leise);margin:0;font-weight:500}
.raster{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.k{position:relative;grid-column:span 6;background:var(--kachel);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.k.w12{grid-column:span 12}.k.w8{grid-column:span 8}.k.w4{grid-column:span 4}.k.w6{grid-column:span 6}.k.w5{grid-column:span 5}.k.w7{grid-column:span 7}
/* EINE REIHE, EIN RASTER (Caspar_D, 27.10.2026: „die Bildunterkanten immer alignieren und die Überschriften der Unterschriften
   ebenfalls auf der gleichen Baseline“). Jede Kachel belegt zwei Zeilen des Seitenrasters und erbt sie (subgrid): Textzeile
   und Bildzeile sind fuer alle Kacheln einer Reihe gleich hoch. Bilder sitzen unten (align-self:end), Texte oben. */
.raster{grid-auto-rows:auto}
.k:not(.quer){display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:0}
.k:not(.quer) > *{min-width:0}
.k:not(.quer) > .text{align-self:start}
.k:not(.quer) > .bild{align-self:end;margin-top:0}
.k:not(.quer) > .bild.konsole{align-self:stretch}
.k:not(.quer) > .filterliste,.k:not(.quer) > .schaubild{align-self:end}
/* Grafik oben, Text darunter (Caspar_D, 27.10.2026: „immer nur den Grafikteil nehmen und einen Text drunterzusetzen“) */
/* Oben ein schwarzes Feld mit duennem Rahmen im Grau des Schriftfelds; die Grafik reicht von Rand zu Rand und steht unten
   auf der Teilungslinie, was darueber frei bleibt, bleibt schwarz (Caspar_D, 27.10.2026). Alle Felder einer Reihe gleich hoch. */
.k.oben > .bild{grid-row:2;align-self:stretch;aspect-ratio:auto!important;margin:0 3px 3px;border-radius:0 0 25px 25px;background:#000;
  display:flex;align-items:flex-end}
.k.oben > .bild img{width:100%;height:auto;object-fit:initial}
/* sichtbare Kante des schwarzen Feldes: zeigt, dass alle Felder einer Reihe gleich gross sind (Caspar_D, 27.10.2026) */
.k.oben > .bild{position:relative}
.k.oben > .bild::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.5px var(--kachel);pointer-events:none}
/* Hell nur beim Nachbarschafts-Diagramm (Caspar_D: „der sollte nur einmal beim Diagramm hell sein, ansonsten Hintergrundfarbe des Textpanels darüber“) */
.k[data-id=nachbar] > .bild::after{box-shadow:inset 0 0 0 1.5px #4a4a52}
.k.oben > .text{grid-row:1}
.k.oben .text{padding-bottom:22px}
/* das „+“ ins Schriftfeld, sonst verdeckt es die Achsenbeschriftung der Grafik */
.k.oben .plus{top:18px;bottom:auto}
.k .text{padding:30px 32px 26px}
.k .klein{font-size:15px;font-weight:600;color:var(--akzent);margin:0 0 6px}
.k h3{font-size:clamp(24px,2.6vw,32px);line-height:1.12;letter-spacing:-.005em;font-weight:700;margin:0 0 10px}
.k p{margin:0;color:var(--leise);font-size:17px;font-weight:500}
.k p b{color:var(--text);font-weight:600}
.k .zahl{display:block;margin:16px 0 0;font-size:40px;line-height:1;font-weight:700;color:var(--text);letter-spacing:-.01em}
.k .zahl small{display:block;font-size:14px;font-weight:600;color:var(--leise);margin-top:6px;letter-spacing:0}
.k .bild{margin-top:auto}
.bild{position:relative;aspect-ratio:16/10;background:var(--kachel2);overflow:hidden}
.k.w4 .bild{aspect-ratio:4/3}
.k.w12 .bild{aspect-ratio:21/9}
.bild img,.bild video{width:100%;height:100%;object-fit:cover;display:block}
.bild.geraete{aspect-ratio:16/11;background:radial-gradient(ellipse at 50% 110%,#3a200c 0%,var(--kachel2) 65%)}
/* Geraetegruppe (Apple-Trio): Laptop hinten Mitte, Tablet vorn links, Handy vorn rechts; schlichte Rahmen ohne Marke */
.geraete .lap{position:absolute;left:14%;top:7%;width:72%}
.geraete .schirm{background:#0b0b0c;border:solid #2a2a2d;border-width:8px 8px 11px;border-radius:12px 12px 0 0;aspect-ratio:16/10;overflow:hidden}
.geraete .fuss{height:9px;margin:0 -6%;background:linear-gradient(#3a3a3e,#1e1e20);border-radius:0 0 10px 10px}
.geraete .tab{position:absolute;left:5%;bottom:5%;height:66%;aspect-ratio:1640/2360;background:#0b0b0c;border:7px solid #2a2a2d;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.geraete .hand{position:absolute;right:7%;bottom:5%;height:52%;aspect-ratio:780/1688;background:#0b0b0c;border:5px solid #2a2a2d;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.geraete img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
@media screen and (max-width:820px){.geraete .schirm{border-width:5px 5px 7px;border-radius:8px 8px 0 0}.geraete .tab{border-width:4px;border-radius:10px}.geraete .hand{border-width:3px;border-radius:11px}}
.k .bild.konsole,.bild.konsole{aspect-ratio:auto;flex:1;min-height:220px;margin:0 22px 0;border-radius:12px 12px 0 0;background:#0a0a0b;border:1px solid #2c2c30;border-bottom:0}
.konsole .leiste{display:flex;align-items:center;gap:7px;padding:10px 12px;background:#18181b;border-bottom:1px solid #2c2c30}
.konsole .leiste i{width:11px;height:11px;border-radius:50%;background:#3a3a3e}
.konsole .leiste span{margin-left:auto;margin-right:auto;font-size:12px;color:#b0b0b5;transform:translateX(-27px)}
.konsole pre{margin:0;padding:14px 16px;font:13px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#b9b9be;white-space:pre;overflow:hidden}
.konsole pre b{color:var(--akzent);font-weight:600}
.konsole pre u{text-decoration:none;color:#e6e6ea}
.schaubild{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;column-gap:22px;padding:6px 32px 34px}
/* Ueberschriften in EINER Zeile des Rasters: gleiche Grundlinie (Caspar_D, 27.10.2026) */
.schaubild .sk{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--akzent)}
.schaubild .l{text-align:right}
.schaubild .sl{font-size:17px;line-height:1.75;color:var(--text);align-self:center}
.schaubild .sl i{font-style:normal;color:var(--leise)}
.schaubild .sm{display:grid;grid-template-columns:56px auto 56px;align-items:center;align-self:center;row-gap:8px}
.schaubild .sm i{height:1px;background:linear-gradient(90deg,transparent,#e31c79)}
.schaubild .sm i:last-of-type{background:linear-gradient(90deg,#e31c79,transparent)}
.schaubild .knopf{width:80px;height:80px;border-radius:50%;border:1.5px solid #e31c79aa;background:#e31c7922;display:grid;place-items:center}
.schaubild .knopf svg{width:38px;height:38px;fill:#e31c79}
.schaubild .sm b{grid-column:2;text-align:center;color:#ff7fb3;font-size:13px;font-weight:600}
@media screen and (max-width:820px){.schaubild{padding:4px 16px 26px;column-gap:10px}.schaubild .sl{font-size:14px;line-height:1.6}.schaubild .sm{grid-template-columns:18px auto 18px}.schaubild .knopf{width:56px;height:56px}.schaubild .knopf svg{width:26px;height:26px}}
/* Querkachel: Text links, Bild rechts */
.k.quer{flex-direction:row;align-items:stretch}
.k.quer .text{flex:0 0 34%;align-self:center}
.k.quer .bild{flex:1;margin-top:0}
@media screen and (max-width:820px){.k.quer{flex-direction:column}.k.quer .text{flex:none}}
.filterliste{padding:4px 32px 30px;margin-top:auto}
.filterliste .fk{margin:16px 0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--akzent)}
.filterliste .fw{margin:0;font-size:16px;line-height:1.55;color:var(--text)}
.bild.trip{display:flex;justify-content:center;align-items:center;gap:4%;padding:5% 6% 0;aspect-ratio:21/11;background:radial-gradient(ellipse at 50% 120%,#3a2410 0%,var(--kachel2) 70%)}
.bild.trip img{width:auto;height:100%;max-width:28%;object-fit:contain;border-radius:22px 22px 0 0;border:6px solid #2b2b2e;border-bottom:0;box-shadow:0 0 0 1px #3a3a3e}
@media screen and (max-width:820px){.bild.trip{aspect-ratio:4/3;gap:3%;padding:6% 3% 0}.bild.trip img{border-radius:14px 14px 0 0;border-width:4px}}
.bild .platz{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--leise);font-size:14px;border:1px dashed #3a3a40;border-radius:16px}
.plus{position:absolute;right:18px;bottom:18px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(66,66,69,.78);backdrop-filter:blur(10px);color:var(--text);cursor:pointer;display:grid;place-items:center}
.plus svg{width:14px;height:14px}
.plus:hover{background:rgba(90,90,94,.9)}
.k .druck{display:none}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:6vh 16px}
.overlay.auf{display:flex}
.fenster{position:relative;max-width:640px;width:100%;background:var(--kachel2);border-radius:28px;padding:48px 48px 40px}
.fenster .klein{font-size:15px;font-weight:600;color:var(--akzent);margin:0 0 6px}
.fenster h4{font-size:clamp(26px,3vw,36px);line-height:1.12;font-weight:700;margin:0 0 22px}
.fenster ul{margin:0;padding:0;list-style:none}
.fenster li{padding:14px 0;border-top:1px solid var(--linie);color:#b4b4b9;font-size:17px}
.fenster li b{color:var(--text);font-weight:600}
.fenster .zu{position:absolute;right:18px;top:18px;width:36px;height:36px;border-radius:50%;border:0;background:#333336;color:var(--text);cursor:pointer;display:grid;place-items:center}
.fenster .zu svg{width:12px;height:12px}
.grenzen{margin:120px 0 0;border-top:1px solid var(--linie);padding-top:28px}
.grenzen h2{font-size:24px;font-weight:700;margin:0 0 12px}
.grenzen ul{margin:0;padding-left:20px;color:var(--leise);font-size:15px}
.grenzen li{margin:0 0 6px}
h1,h2,h3,h4{text-wrap:balance}
.k p,.held p,.kopf p,.fenster li,.grenzen li{text-wrap:pretty}
footer{margin:40px 0 0;color:var(--leise);font-size:13px}
@media screen and (max-width:820px){
  .raster{gap:14px}
  .k,.k.w4,.k.w5,.k.w6,.k.w7,.k.w8{grid-column:span 12}
  .k .text{padding:26px 24px 22px}
  .held{padding:48px 0 28px}
  .held .bild{aspect-ratio:4/3;border-radius:22px}
  .abschnitt{margin-top:84px}
  .k.w12 .bild{aspect-ratio:4/3}
  .fenster{padding:44px 24px 28px}
  .k h3{padding-right:40px}
  .grenzen{margin-top:84px}
  .konsole pre{font-size:11px;white-space:pre-wrap;word-break:break-all}
  .filterliste{padding-bottom:64px}
}
@media screen and (max-width:480px){
  .schaubild{grid-template-columns:1fr;row-gap:14px;padding-bottom:64px}
  .schaubild .l,.schaubild .r{text-align:left}
  .schaubild .sm{justify-self:center}
}
/* Zwei Paare mit Liste daneben: unter 1100 px wird die Liste so hoch, dass ueber dem Bild ein schwarzes Band entsteht */
@media screen and (max-width:1100px) and (min-width:821px){
  .k[data-id=messdaten],.k[data-id=messliste],.k[data-id=effektclip],.k[data-id=rezept],.k[data-id=uebersicht],.k[data-id=filtern]{grid-column:span 12}
}
@media (pointer:coarse){.sprache button{min-height:44px;min-width:44px}}
@media print{
  /* Druck (Caspar_D, 28.10.2026): A4, ein Satzspiegel mit Rand zum Atmen; Schrift auf zwei Dritteln der Breite,
     Bilder ueber die ganze Satzbreite. Dieselbe Seite, nur anders gesetzt. Der Rand liegt als Innenabstand auf main
     und wiederholt sich je Seite (clone), damit er schwarz bleibt statt weiss wie ein @page-Rand. */
  @page{size:A4;margin:0}
  html,body{background:#000}
  body{font-size:10.5pt;line-height:1.45}
  main{max-width:none;padding:18mm 20mm 16mm;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .sprache,.plus,.overlay{display:none!important}
  /* Kopf */
  .held{padding:0 0 6mm;text-align:left}
  .held h1{font-size:30pt;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--akzent)}
  .held .spruch{font-size:20pt}
  .held p{font-size:12pt;max-width:66.6%;margin:0 0 6mm}
  .held .bild{aspect-ratio:21/9;border-radius:3mm}
  /* Abschnitte: Ueberschrift beginnt eine neue Seite nur, wenn sie sonst allein unten stuende */
  .abschnitt{margin:12mm 0 0;break-before:auto}
  .abschnitt>.kopf{max-width:66.6%;margin:0 0 6mm;break-inside:avoid;break-after:avoid}
  .abschnitt>.kopf .augenbraue{font-size:10pt}
  .abschnitt>.kopf h2{font-size:24pt}
  .abschnitt>.kopf p{font-size:12pt}
  /* Kacheln untereinander, ohne Kachelflaeche: Text, darunter das Bild */
  .raster{display:block}
  .k,.k.quer,.k:not(.quer){display:block;background:none;border-radius:0;overflow:visible;margin:0 0 9mm;break-inside:avoid}
  .k .text,.k.oben .text,.k.quer .text{max-width:66.6%;padding:0 0 3.5mm}
  .k .klein{font-size:9.5pt;margin:0 0 1mm}
  .k h3{font-size:15pt;margin:0 0 1.5mm}
  .k p{font-size:10.5pt}
  .k .zahl{font-size:22pt;margin:3mm 0 0}
  .k .druck{display:block;margin:2.5mm 0 0;padding:0 0 0 4mm;color:var(--leise);font-size:9.5pt}
  .k .druck li{margin:0 0 1mm}
  .k .druck b{color:var(--text)}
  /* Bilder: volle Satzbreite in ihrem eigenen Format; hohe Bilder hoechstens 110 mm hoch, damit Text und Bild meist zu zweit auf eine Seite passen */
  .k .bild,.k.oben > .bild,.k.w4 .bild,.k.w12 .bild{aspect-ratio:auto!important;margin:0;border-radius:3mm;background:none;display:block}
  .k.oben > .bild::after{display:none}
  .k .bild img,.k .bild video{width:100%;height:auto;max-height:110mm;width:auto;max-width:100%;object-fit:contain;object-position:left top;border-radius:3mm}
  .k .bild.trip,.k .bild.geraete{aspect-ratio:21/11!important}
  .k .bild.konsole{min-height:0;margin:0;max-width:66.6%;border-radius:2mm;border:1px solid #2c2c30}
  .konsole pre{font-family:Menlo,Consolas,monospace;font-size:8.5pt}
  .filterliste,.schaubild{padding:0;max-width:100%}
  .grenzen{margin:12mm 0 0;break-inside:avoid}
  footer{break-before:avoid}
}

<script>
// Texte: ein Wörterbuch je Sprache. Kachel = {id, w (Breite 4/6/8/12), klein, h, p, zahl?, d (Einzelheiten)}.
// Bilder: BILDER[id] = 'img/<id>.webp' oder '.mp4'; fehlt der Eintrag, steht ein Platzhalter.
const S = {
 kopf:{
  marke:{en:'KlangTresor',de:'KlangTresor',ru:'KlangTresor'},
  h:{en:'Your Suno music. At home.',de:'Deine Suno-Musik. Bei dir.',ru:'Твоя музыка из Suno. У тебя дома.'},
  p:{en:'Suno makes the songs. KlangTresor keeps them, plays them, measures them and shows them, on every screen in your home.',

  mehr:{en:'More',de:'Mehr',ru:'Подробнее'}, zu:{en:'Close',de:'Schließen',ru:'Закрыть'},
  platz:{en:'Picture follows',de:'Bild folgt',ru:'Изображение будет'}
 },
 abschnitte:[
 {augenbraue:{en:'Setup',de:'Aufbau',ru:'Устройство'},
  h:{en:'Runs at home.<br>Plays anywhere on your Wi-Fi.',de:'Läuft zu Hause.<br>Spielt überall im WLAN.',ru:'Работает дома.<br>Играет везде в домашнем Wi-Fi.'},
  p:{en:'One computer keeps the vault. Every screen in your home network opens it.',de:'Ein Rechner hält den Tresor. Jeder Bildschirm in deinem Heimnetz öffnet ihn.',ru:'Один компьютер хранит сейф. Любой экран в домашней сети открывает его.'},
  kacheln:[
  {id:'server',w:4,klein:{en:'Where it runs',de:'Wo es läuft',ru:'Где работает'},
   h:{en:'One computer at home.',de:'Ein Rechner zu Hause.',ru:'Один компьютер дома.'},
   p:{en:'<b>macOS, Windows, Linux or Docker.</b> Set up with a double click (on Linux, one command). Your archive is a folder on its disk.',de:'<b>macOS, Windows, Linux oder Docker.</b> Eingerichtet per Doppelklick (unter Linux ein Befehl). Dein Archiv ist ein Ordner auf seiner Platte.',ru:'<b>macOS, Windows, Linux или Docker.</b> Установка двойным щелчком (в Linux — одной командой). Твой архив — папка на его диске.'},
   d:{en:['<b>Needs Node.js and ffmpeg.</b> The setup brings Node.js along; it fetches ffmpeg itself on Windows, on Mac and Linux one command does it.','<b>Space:</b> about 1.6 GB for the program and its models, plus 3.1 GB for Whisper; then about 160 MB per song with everything that belongs to it: WAV, instrument tracks, analysis, covers (measured on the author’s 343 songs).','<b>The computer is the server.</b> While its window is open, your vault is reachable; close it and the vault sleeps.'],
      de:['<b>Braucht Node.js und ffmpeg.</b> Node.js bringt die Einrichtung mit; ffmpeg holt sie unter Windows selbst, auf Mac und Linux genügt ein Befehl.','<b>Platz:</b> rund 1,6 GB für Programm und Modelle, dazu 3,1 GB für Whisper; dann rund 160 MB je Titel mit allem, was dazugehört: WAV, Instrumentspuren, Analyse, Cover (gemessen an den 343 Titeln des Autors).','<b>Der Rechner ist der Server.</b> Solange sein Fenster offen ist, ist dein Tresor erreichbar; schließt du es, schläft er.'],
      ru:['<b>Нужны Node.js и ffmpeg.</b> Node.js установка приносит с собой; ffmpeg на Windows она загружает сама, на Mac и Linux хватит одной команды.','<b>Место:</b> около 1,6 ГБ на программу и модели и ещё 3,1 ГБ на Whisper; затем около 160 МБ на песню со всем, что к ней относится: WAV, инструментальные дорожки, анализ, обложки (измерено на 343 песнях автора).','<b>Компьютер — это сервер.</b> Пока его окно открыто, сейф доступен; закроешь окно — сейф спит.']}},
  {id:'leser',w:8,klein:{en:'Who reads it',de:'Wer es liest',ru:'Кто открывает'},
   h:{en:'Every screen with a browser.',de:'Jeder Bildschirm mit Browser.',ru:'Любой экран с браузером.'},
   p:{en:'<b>Laptop, iPhone, Android, iPad, tablet.</b> Anything that runs a web browser in your home network. Nothing to install.',de:'<b>Laptop, iPhone, Android, iPad, Tablet.</b> Alles, was im Heimnetz einen Webbrowser hat. Nichts zu installieren.',ru:'<b>Ноутбук, iPhone, Android, iPad, планшет.</b> Всё, на чём в домашней сети есть веб-браузер. Ничего не нужно устанавливать.'},
   d:{en:['<b>Scan a QR code</b> on the computer and the phone opens your vault.','<b>On the home screen</b> like an app; on the iPhone without the address bar.','<b>Home network only.</b> From outside only if you open it on your router. Inside there is no password: whoever is on your network and knows the address can listen.'],
      de:['<b>QR-Code am Rechner scannen</b>, und das Handy öffnet deinen Tresor.','<b>Auf dem Startbildschirm</b> wie eine App, auf dem iPhone ohne Adresszeile.','<b>Nur im Heimnetz.</b> Von außen nur, wenn du es am Router freigibst. Drinnen gibt es kein Passwort: wer in deinem Netz ist und die Adresse kennt, kann mithören.'],
      ru:['<b>Отсканируй QR-код</b> на компьютере — и телефон откроет твой сейф.','<b>На главном экране</b>, как приложение; на iPhone — без адресной строки.','<b>Только домашняя сеть.</b> Снаружи — только если открыть доступ на роутере. Внутри пароля нет: кто в твоей сети и знает адрес, может слушать.']}}
  ]},
 {augenbraue:{en:'Collect',de:'Sammeln',ru:'Собрать'},
  h:{en:'Suno fills it.<br>You keep it.',de:'Suno füllt ihn.<br>Du behältst ihn.',ru:'Suno наполняет.<br>Остаётся у тебя.'},
  p:{en:'One click on the bookmark at Suno and on the red button, and the vault fetches what is new. If Suno changes, or your subscription ends, everything is already at home.',de:'Ein Klick aufs Lesezeichen bei Suno und auf den roten Knopf, und der Tresor holt, was neu ist. Ändert sich Suno oder endet dein Abo, ist alles schon bei dir.',ru:'Один щелчок по закладке в Suno и по красной кнопке — и сейф забирает новое. Если Suno изменится или закончится подписка — всё уже у тебя дома.'},
  kacheln:[
  {id:'morgenlauf',w:12,quer:true,klein:{en:'Morning run',de:'Morgenlauf',ru:'Утренний запуск'},
   h:{en:'Everything you made. In full.',de:'Alles, was du gemacht hast. Vollständig.',ru:'Всё созданное тобой. Полностью.'},
   p:{en:'Covers, moving covers, lyrics, playlists, comments and hearts. The audio, MP3 and lossless WAV, it takes straight from your downloads; whatever you have not downloaded yet, you unlock at Suno.',de:'Cover, Bewegtbilder, Liedtexte, Playlists, Kommentare und Herzen. Den Ton, MP3 und verlustfreies WAV, übernimmt er sofort aus deinen Downloads; was noch nicht heruntergeladen ist, schaltest du bei Suno frei.',ru:'Обложки, видеообложки, тексты, плейлисты, комментарии и лайки. Звук, MP3 и WAV без потерь, он сразу берёт из твоих загрузок; то, что ещё не скачано, открываешь для загрузки в Suno.'},
   d:{en:['<b>Private songs too</b>, as long as they sit in one of your own playlists.','<b>Your Suno login stays in your browser.</b> A bookmark does the fetching; KlangTresor never sees a password.','<b>Only new things travel.</b> What is already at home is not fetched again.'],
      de:['<b>Auch private Titel</b>, solange sie in einer deiner eigenen Playlists liegen.','<b>Deine Suno-Anmeldung bleibt in deinem Browser.</b> Ein Lesezeichen holt die Daten; KlangTresor sieht nie ein Passwort.','<b>Nur Neues wird geholt.</b> Was schon zu Hause ist, kommt nicht noch einmal.'],
      ru:['<b>Приватные песни тоже</b> — если они лежат в одном из твоих плейлистов.','<b>Вход в Suno остаётся в твоём браузере.</b> Данные забирает закладка; KlangTresor никогда не видит пароль.','<b>Забирается только новое.</b> То, что уже дома, повторно не скачивается.']}},
  {id:'schaubild',w:12,klein:{en:'What travels',de:'Was wohin geht',ru:'Что куда идёт'},
   h:{en:'From Suno into your vault.',de:'Von Suno in deinen Tresor.',ru:'Из Suno в твой сейф.'},
   p:{en:'Suno delivers the songs. Everything that can be measured is computed at home.',de:'Suno liefert die Titel. Alles, was sich messen lässt, wird zu Hause gerechnet.',ru:'Suno поставляет песни. Всё, что можно измерить, рассчитывается дома.'},
   d:{en:['<b>The red button</b> at the top of KlangTresor starts the morning run by hand.'],
      de:['<b>Der rote Knopf</b> oben im KlangTresor startet den Morgenlauf von Hand.'],
      ru:['<b>Красная кнопка</b> вверху KlangTresor вручную запускает утреннюю загрузку.']}},
  ]},
 {augenbraue:{en:'Overview',de:'Übersicht',ru:'Обзор'},
  h:{en:'Everything at a glance.',de:'Alles auf einen Blick.',ru:'Всё с одного взгляда.'},
  p:{en:'Your whole work as a wall of covers. Filter, sort, and one click plays.',de:'Dein ganzes Werk als Wand aus Covern. Filtern, sortieren, und ein Klick spielt.',ru:'Всё твоё творчество — стена обложек. Фильтруй, сортируй, один щелчок — и играет.'},
  kacheln:[
  {id:'uebersicht',w:8,klein:{en:'Filter, sort, listen',de:'Filtern, sortieren, anhören',ru:'Фильтровать, сортировать, слушать'},
   h:{en:'Find any song in seconds.',de:'Jeden Titel in Sekunden.',ru:'Любая песня — за секунды.'},
   p:{en:'Tags in the search field, choices below, the player always at hand.',de:'Marken im Suchfeld, Auswahl darunter, der Spieler immer zur Hand.',ru:'Метки в поле поиска, выбор под ним, плеер всегда под рукой.'},
   d:{en:['<b>Tile size</b> from a few large covers to ten in a row.','<b>A click on a cover</b> plays the song; the stage is one more click away.'],
      de:['<b>Kachelgröße</b> von wenigen großen Covern bis zehn in einer Reihe.','<b>Ein Klick aufs Cover</b> spielt den Titel; die Bühne ist einen Klick weiter.'],
      ru:['<b>Размер плиток</b> — от нескольких больших обложек до десяти в ряд.','<b>Щелчок по обложке</b> запускает песню; сцена — ещё один щелчок.']}},
  {id:'filtern',w:4,klein:{en:'What you can filter by',de:'Wonach du filterst',ru:'Чем фильтровать'},
   h:{en:'Narrow it down.',de:'Eingrenzen.',ru:'Сузить выбор.'},
   p:{en:'Everything the vault knows about a song can become a filter.',de:'Alles, was der Tresor über einen Titel weiß, kann ein Filter werden.',ru:'Всё, что сейф знает о песне, может стать фильтром.'},
   d:{en:['<b>Tags combine:</b> each one narrows the wall further.','<b>One click on ×</b> removes a tag again.'],
      de:['<b>Marken lassen sich kombinieren:</b> jede grenzt die Wand weiter ein.','<b>Ein Klick aufs ×</b> nimmt eine Marke wieder weg.'],
      ru:['<b>Метки сочетаются:</b> каждая сужает стену дальше.','<b>Щелчок по ×</b> снимает метку.']}}
  ]},
 {augenbraue:{en:'Listen',de:'Hören',ru:'Слушать'},
  h:{en:'A stage for every song.',de:'Eine Bühne für jeden Titel.',ru:'Сцена для каждой песни.'},
  p:{en:'Full screen, cover or moving image, and the lyrics follow the voice word by word.',de:'Vollbild, Cover oder Bewegtbild, und der Text folgt der Stimme Wort für Wort.',ru:'Полный экран, обложка или видео — и текст следует за голосом слово за словом.'},
  kacheln:[
  {id:'buehne',w:6,klein:{en:'Karaoke',de:'Karaoke',ru:'Караоке'},
   h:{en:'Sing along. Word by word.',de:'Mitsingen. Wort für Wort.',ru:'Пой вместе. Слово за словом.'},
   p:{en:'Word timing is computed on your own computer, for German, English and Russian songs.',de:'Die Wortzeiten rechnet dein eigener Rechner, für deutsche, englische und russische Titel.',ru:'Тайминг слов рассчитывает твой компьютер — для немецких, английских и русских песен.'},
   d:{en:['<b>Whisper runs locally.</b> Your lyrics never leave the house.','<b>Readable from the sofa:</b> the current line large, the next one announced, the controls fade away.','<b>Cover or moving cover</b> behind the text, and your own effect clips.'],
      de:['<b>Whisper läuft lokal.</b> Deine Texte verlassen das Haus nicht.','<b>Vom Sofa lesbar:</b> die aktuelle Zeile groß, die nächste angekündigt, die Knöpfe blenden aus.','<b>Cover oder Bewegtbild</b> hinter dem Text, dazu deine eigenen Effektclips.'],
      ru:['<b>Whisper работает локально.</b> Твои тексты не покидают дом.','<b>Читается с дивана:</b> текущая строка крупно, следующая — заранее, кнопки исчезают.','<b>Обложка или видеообложка</b> за текстом, а также твои эффект-клипы.']}},
  {id:'visualisierung',w:6,klein:{en:'Visualisations',de:'Visualisierungen',ru:'Визуализации'},
   h:{en:'Light that listens.',de:'Licht, das zuhört.',ru:'Свет, который слушает.'},
   p:{en:'Seven of its own, plus Butterchurn.',de:'Sieben eigene, dazu Butterchurn.',ru:'Семь собственных и Butterchurn.'},
   zahl:{n:'333',t:{en:'MilkDrop presets',de:'MilkDrop-Presets',ru:'пресета MilkDrop'}},
   d:{en:['<b>Seven visualisations</b> built for KlangTresor.','<b>Butterchurn</b> brings the classic MilkDrop look with 333 presets.'],
      de:['<b>Sieben Visualisierungen</b>, eigens für KlangTresor gebaut.','<b>Butterchurn</b> bringt den klassischen MilkDrop-Look mit 333 Presets.'],
      ru:['<b>Семь визуализаций</b>, созданных специально для KlangTresor.','<b>Butterchurn</b> — классический вид MilkDrop с 333 пресетами.']}}
  ]},
 {augenbraue:{en:'Sound studio',de:'Tonstudio',ru:'Звуковая студия'},
  h:{en:'A real studio.<br>In your browser.',de:'Ein echtes Studio.<br>Im Browser.',ru:'Настоящая студия.<br>В браузере.'},
  p:{en:'Equaliser, bells, compressor, boombox and room calibration. One chain, in the order an engineer would build it.',de:'Equalizer, Glocken, Kompressor, Boombox und Einmessen. Eine Kette, in der Reihenfolge, in der ein Toningenieur sie baut.',ru:'Эквалайзер, колокола, компрессор, бумбокс и калибровка комнаты. Одна цепочка — в том порядке, в каком её строит звукоинженер.'},
  kacheln:[
  {id:'eq',w:5,oben:true,klein:{en:'8-band equaliser',de:'8-Band-Equalizer',ru:'8-полосный эквалайзер'},
   h:{en:'Eight bands. Your sound.',de:'Acht Bänder. Dein Klang.',ru:'Восемь полос. Твой звук.'},
   p:{en:'Start neutral, or let a song match the rest of your collection, its style group, its album or a reference song.',de:'Neutral beginnen oder einen Titel angleichen: an die Sammlung, an seine Stilgruppe, an sein Album oder an einen Referenztitel.',ru:'Начни с нейтрали или подгони песню: под коллекцию, под её стилевую группу, под её альбом или под эталонную песню.'},
   d:{en:['<b>Every band shows its headroom.</b> The song itself decides how much a band can be raised.','<b>Matching</b> to collection, style group, album or reference is computed from the measured spectra.','<b>On the phone</b> as eight sliders with presets.'],
      de:['<b>Jedes Band zeigt seinen Spielraum.</b> Wie weit es sich anheben lässt, bestimmt der Titel selbst.','<b>Angleichen</b> an Sammlung, Stilgruppe, Album oder Referenz wird aus den gemessenen Spektren gerechnet.','<b>Auf dem Handy</b> als acht Regler mit Voreinstellungen.'],
      ru:['<b>Каждая полоса показывает свой запас.</b> Насколько её можно поднять, решает сама песня.','<b>Подгонка</b> под коллекцию, стилевую группу, альбом или эталон рассчитывается по измеренным спектрам.','<b>На телефоне</b> — восемь ползунков с пресетами.']}},
  {id:'glockenstuhl',w:7,oben:true,klein:{en:'Bell frame',de:'Glockenstuhl',ru:'Колокольная рама'},
   h:{en:'Bells you can grab.',de:'Glocken zum Anfassen.',ru:'Колокола под рукой.'},
   p:{en:'Six bell filters, free in frequency, height and width, plus two shelves.',de:'Sechs Glockenfilter, frei in Frequenz, Höhe und Breite, dazu zwei Randfilter.',ru:'Шесть колокольных фильтров — свободно по частоте, высоте и ширине, плюс два полочных.'},
   d:{en:['<b>Drag a bell</b> to move it; the handles on its shoulders set its width.','<b>Single or stacked:</b> see each bell on its own, or how they add up.','<b>A notch</b> removes a single annoying frequency.'],
      de:['<b>Eine Glocke ziehen</b>, um sie zu verschieben; die Griffe an ihren Schultern stellen die Breite.','<b>Einzeln oder gestapelt:</b> jede Glocke für sich oder ihre Summe.','<b>Ein Sperrfilter</b> nimmt eine einzelne störende Frequenz heraus.'],
      ru:['<b>Перетащи колокол</b>, чтобы сдвинуть его; ручки на его плечах задают ширину.','<b>По отдельности или стопкой:</b> каждый колокол сам по себе или их сумма.','<b>Режекторный фильтр</b> убирает одну мешающую частоту.']}},
  {id:'kompressor',w:6,oben:true,klein:{en:'Compressor',de:'Kompressor',ru:'Компрессор'},
   h:{en:'Compressor. Or a gradation curve.',de:'Kompressor. Oder Gradationskurve.',ru:'Компрессор. Или градационная кривая.'},
   p:{en:'The classic knee with threshold, ratio and limiter, or a curve like in a photo editor: quiet point, loud point, gamma.',de:'Die klassische Knickkurve mit Schwelle, Verhältnis und Limiter, oder eine Kurve wie im Bildprogramm: Leisepunkt, Lautpunkt, Gamma.',ru:'Классическое колено с порогом, соотношением и лимитером — или кривая, как в фоторедакторе: тихая точка, громкая точка, гамма.'},
   d:{en:['<b>Two modes, one stage:</b> compressor or gradation compressor, never both at once.','<b>The curve is drawn live</b>, with the gain reduction as it happens.','<b>Gamma or sigmoid</b> with a single slider, for those who think in pictures.'],
      de:['<b>Zwei Arten, eine Stufe:</b> Kompressor oder Gradationskompressor, nie beides zugleich.','<b>Die Kennlinie wird live gezeichnet</b>, mit der Absenkung im Augenblick.','<b>Gamma oder Sigmoid</b> mit einem einzigen Regler, für alle, die in Bildern denken.'],
      ru:['<b>Два режима, одна ступень:</b> компрессор или градационный компрессор, никогда оба сразу.','<b>Кривая рисуется вживую</b>, вместе с текущим подавлением.','<b>Гамма или сигмоида</b> одним ползунком — для тех, кто мыслит картинками.']}},
  {id:'boombox',w:6,oben:true,klein:{en:'Boombox',de:'Boombox',ru:'Бумбокс'},
   h:{en:'One switch for everything.',de:'Ein Schalter für alles.',ru:'Один переключатель на всё.'},
   p:{en:'Loudness, more bass, more treble, clear voice, night mode. Plus MEGA BASS, reverb, echo and stereo width.',de:'Loudness, mehr Bass, mehr Höhen, Stimme frei, Nachtmodus. Dazu MEGA BASS, Hall, Echo und Stereobreite.',ru:'Loudness, больше баса, больше высоких, чистый голос, ночной режим. А также MEGA BASS, реверберация, эхо и стереоширина.'},
   d:{en:['<b>Night mode</b> turns down the lows that travel through walls.','<b>Tempo</b> faster or slower, with or without keeping the pitch.','<b>A clip light</b> warns when everything together gets too loud.'],
      de:['<b>Nachtmodus</b> nimmt die Tiefen zurück, die durch Wände dringen.','<b>Tempo</b> schneller oder langsamer, mit oder ohne gehaltene Tonhöhe.','<b>Eine Übersteuerungslampe</b> warnt, wenn alles zusammen zu laut wird.'],
      ru:['<b>Ночной режим</b> убирает низы, которые проходят сквозь стены.','<b>Темп</b> быстрее или медленнее, с сохранением высоты тона или без.','<b>Индикатор перегрузки</b> предупреждает, когда всё вместе становится слишком громким.']}},
  {id:'einmessen',w:12,klein:{en:'Calibration',de:'Einmessen',ru:'Калибровка'},
   h:{en:'Tuned to your room.',de:'Abgestimmt auf deinen Raum.',ru:'Настроено под твою комнату.'},
   p:{en:'The microphone of your computer measures your speakers where you sit. The spectrum shows the whole chain: what Suno delivered, and what your settings make of it.',de:'Das Mikrofon deines Rechners vermisst die Lautsprecher dort, wo du sitzt. Das Spektrum zeigt die ganze Kette: was Suno geliefert hat und was deine Einstellung daraus macht.',ru:'Микрофон компьютера измеряет колонки там, где ты сидишь. Спектр показывает всю цепочку: что выдал Suno и что из этого делают твои настройки.'},
   d:{en:['<b>Measured at the listening position</b>, not in a lab.','<b>Before and after</b> side by side in one spectrum.'],
      de:['<b>Gemessen am Hörplatz</b>, nicht im Labor.','<b>Vorher und nachher</b> nebeneinander in einem Spektrum.'],
      ru:['<b>Измерено на месте прослушивания</b>, а не в лаборатории.','<b>До и после</b> рядом в одном спектре.']}}
  ]},
 {augenbraue:{en:'Understand',de:'Verstehen',ru:'Понять'},
  h:{en:'Take a look inside your songs.',de:'Schau dir die Analyse deiner Songs an.',ru:'Загляни в анализ своих песен.'},
  p:{en:'Every song measured. The whole collection as a sky of stars.',de:'Jeder Titel vermessen. Der ganze Bestand als Sternenhimmel.',ru:'Каждая песня измерена. Вся коллекция — звёздное небо.'},
  kacheln:[
  {id:'klangraum',w:12,klein:{en:'Sound Space',de:'Klangraum',ru:'Пространство звука'},
   h:{en:'Your songs as a sky of stars, sorted by sound groups.',de:'Deine Titel als Sternenhimmel, sortiert nach Klanggruppen.',ru:'Твои песни — звёздное небо, по звуковым группам.'},
   p:{en:'Songs that sound alike become neighbours. Size, brightness and corona tell plays, hearts and comments.',de:'Was ähnlich klingt, wird Nachbar. Größe, Helligkeit und Korona erzählen Abrufe, Herzen und Kommentare.',ru:'Похожие по звуку песни становятся соседями. Размер, яркость и корона — прослушивания, лайки и комментарии.'},
   d:{en:['<b>Closeness is sound</b>, measured from the audio on your computer, in three dimensions.','<b>Fly from song to song</b> in a ship, a cube, a raven or a Martian saucer.'],
      de:['<b>Nähe ist Klang</b>, auf deinem Rechner aus dem Ton gemessen, in drei Dimensionen.','<b>Von Titel zu Titel fliegen</b>, im Schiff, im Kubus, als Rabe oder in der Untertasse des Marsianers.'],
      ru:['<b>Близость — это звук</b>, измеренный по аудио на твоём компьютере, в трёх измерениях.','<b>Лети от песни к песне</b> — на корабле, в кубе, вороном или в тарелке марсианина.']}},
  {id:'messdaten',w:8,oben:true,klein:{en:'Analysis',de:'Analyse',ru:'Анализ'},
   h:{en:'Every song, measured.',de:'Jeder Titel, vermessen.',ru:'Каждая песня — измерена.'},
   p:{en:'The structure from Suno’s sections, the beat grid, and where the level sits too high or the stereo cancels out.',de:'Die Struktur aus Sunos Abschnitten, das Taktraster, und wo der Pegel zu hoch sitzt oder das Stereo sich auslöscht.',ru:'Структура по разделам Suno, сетка ударов, и где уровень слишком высок или стерео гасится.'},
   d:{en:['<b>The playhead</b> runs through all lanes, so every finding has its place in the song.','<b>Targets for each platform:</b> streaming, Spotify, Apple Music, YouTube, club, broadcast.'],
      de:['<b>Der Spielkopf</b> läuft durch alle Bahnen, so hat jeder Befund seine Stelle im Titel.','<b>Ziele je Plattform:</b> Streaming, Spotify, Apple Music, YouTube, Club, Rundfunk.'],
      ru:['<b>Курсор воспроизведения</b> проходит через все дорожки — у каждой находки своё место в песне.','<b>Цели для каждой платформы:</b> стриминг, Spotify, Apple Music, YouTube, клуб, радио.']}},
  {id:'messliste',w:4,klein:{en:'What is measured',de:'Was gemessen wird',ru:'Что измеряется'},
   h:{en:'Measured at home.',de:'Zu Hause gemessen.',ru:'Измерено дома.'},
   p:{en:'Computed on your computer for every song.',de:'Auf deinem Rechner, für jeden Titel.',ru:'На твоём компьютере, для каждой песни.'},
   d:{en:['<b>No upload:</b> the audio never leaves the house.'],de:['<b>Kein Hochladen:</b> der Ton verlässt das Haus nicht.'],ru:['<b>Без загрузки:</b> звук не покидает дом.']}}
  ]},
 {augenbraue:{en:'Listeners',de:'Hörer',ru:'Слушатели'},
  h:{en:'Your music and your listeners.',de:'Deine Musik und deine Zuhörer.',ru:'Твоя музыка и твои слушатели.'},
  p:{en:'Which songs move people week by week, and who the people are.',de:'Welche Titel Woche für Woche bewegen, und wer die Menschen dahinter sind.',ru:'Какие песни трогают людей неделя за неделей — и кто эти люди.'},
  kacheln:[
  {id:'profil',w:12,oben:true,klein:{en:'Hit stream',de:'Hitstrom',ru:'Поток хитов'},
   h:{en:'Week by week.',de:'Woche für Woche.',ru:'Неделя за неделей.'},
   p:{en:'The twelve songs with the most momentum, and their share of the attention each week.',de:'Die zwölf bewegtesten Titel und ihr Anteil an der Resonanz in jeder Woche.',ru:'Двенадцать самых активных песен и их доля отклика каждую неделю.'},
   d:{en:['<b>Weekly charts</b> of your own songs below it, by momentum, hearts and plays.'],de:['<b>Wöchentliche Hitparaden</b> deiner Titel darunter, nach Bewegung, Herzen und Abrufen.'],ru:['<b>Еженедельные хит-парады</b> твоих песен ниже — по динамике, лайкам и прослушиваниям.']}},
  {id:'groupie',w:6,oben:true,klein:{en:'Groupie foam',de:'Groupieschaum',ru:'Пена поклонников'},
   h:{en:'Every listener a cell.',de:'Jeder Hörer eine Zelle.',ru:'Каждый слушатель — ячейка.'},
   p:{en:'Everyone who gave you hearts or comments, with their avatar. Here sized by loyalty: from first to last reaction.',de:'Alle, die dir Herzen oder Kommentare gegeben haben, mit ihrem Avatar. Hier nach Treue: von der ersten bis zur letzten Reaktion.',ru:'Все, кто ставил тебе лайки или писал комментарии, со своим аватаром. Здесь по верности: от первой до последней реакции.'},
   d:{en:['<b>Other measures:</b> hearts, comments, length of comments, recent activity, number of songs.'],de:['<b>Weitere Maße:</b> Herzen, Kommentare, Länge der Kommentare, jüngste Aktivität, Zahl der Titel.'],ru:['<b>Другие меры:</b> лайки, комментарии, длина комментариев, недавняя активность, число песен.']}},
  {id:'nachbar',w:6,oben:true,klein:{en:'Neighbourhood',de:'Nachbarschaft',ru:'Окружение'},
   h:{en:'Where you stand.',de:'Wo du stehst.',ru:'Где ты находишься.'},
   p:{en:'Everyone around you who makes music: how many they follow and how many follow them. You in orange.',de:'Alle um dich herum, die selbst Musik machen: wie vielen sie folgen und wie viele ihnen folgen. Du in Orange.',ru:'Все вокруг тебя, кто сам делает музыку: на скольких они подписаны и сколько подписано на них. Ты выделен оранжевым.'},
   d:{en:['<b>Both axes are logarithmic.</b> On the line, following and followers balance.'],de:['<b>Beide Achsen sind logarithmisch.</b> Auf der Linie halten sich Folgen und Gefolgtwerden die Waage.'],ru:['<b>Обе оси логарифмические.</b> На линии подписки и подписчики уравновешены.']}},
  {id:'gemein',w:12,oben:true,klein:{en:'Community',de:'Gemeinschaft',ru:'Сообщество'},
   h:{en:'Who is there for you.',de:'Wer für dich da ist.',ru:'Кто рядом с тобой.'},
   p:{en:'Who comments the most, who gives the most hearts, and both together. This month, this year, or all time.',de:'Wer am meisten kommentiert, wer die meisten Herzen gibt, und beides zusammen. Diesen Monat, dieses Jahr oder seit Beginn.',ru:'Кто больше всех комментирует, кто ставит больше всех лайков, и оба вместе. За месяц, за год или за всё время.'},
   d:{en:['<b>A click on a name</b> opens everything that person wrote to you.'],de:['<b>Ein Klick auf einen Namen</b> zeigt alles, was diese Person dir geschrieben hat.'],ru:['<b>Щелчок по имени</b> показывает всё, что этот человек тебе написал.']}}
  ]},
 {augenbraue:{en:'Your work as a picture',de:'Dein ganzes Werk als Bild',ru:'Всё творчество — одной картиной'},
  h:{en:'Your whole work. One picture.',de:'Dein ganzes Werk. Ein Bild.',ru:'Всё творчество. Одна картина.'},
  p:{en:'As a picture wall with a timeline, or as a foam with a catalogue of works. As a PDF for the print shop.',de:'Als Bilderschau mit Zeitleiste oder als Schaum mit Werkverzeichnis. Als PDF für die Druckerei.',ru:'Как стена картин со шкалой времени или как пена с каталогом работ. В PDF для типографии.'},
  kacheln:[
  {id:'klangschaum',w:12,oben:true,klein:{en:'Sound foam, picture wall',de:'Klangschaum, Bilderschau',ru:'Звуковая пена, стена картин'},
   h:{en:'Every song a cell.',de:'Jeder Titel eine Zelle.',ru:'Каждая песня — ячейка.'},
   p:{en:'Sized by plays, hearts or length. Or the covers hung like a salon exhibition.',de:'Groß nach Abrufen, Herzen oder Länge. Oder die Cover als Salonhängung.',ru:'Размер — по прослушиваниям, лайкам или длительности. Или обложки, развешенные как в салоне.'},
   d:{en:['<b>Grouped by album, genre or space</b>, coloured by group.','<b>Every song keeps its true area.</b> Zoom in until the smallest cell can be tapped.','<b>A tap plays the song.</b>'],
      de:['<b>Gegliedert nach Album, Genre oder Klanggruppe</b>, gefärbt nach Gruppe.','<b>Jeder Titel behält seine wahre Fläche.</b> Heranzoomen, bis auch die kleinste Zelle antippbar ist.','<b>Ein Tipp spielt den Titel.</b>'],
      ru:['<b>Группировка по альбому, жанру или пространству</b>, цвет — по группе.','<b>Каждая песня сохраняет истинную площадь.</b> Приблизь — и даже самую маленькую ячейку можно нажать.','<b>Касание запускает песню.</b>']}},
  {id:'zimmer',w:7,oben:true,klein:{en:'Poster studio',de:'Plakat-Studio',ru:'Студия плакатов'},
   h:{en:'Print it. Hang it.',de:'Drucken. Aufhängen.',ru:'Напечатай. Повесь.'},
   p:{en:'A PDF export ready for the print shop, from A3 to 100 × 140 cm, free formats up to 3 m. Here the picture show on paper, 100 × 60 cm, with its timeline.',de:'Ein PDF-Export, fertig für die Druckerei, von A3 bis 100 × 140 cm, freie Formate bis 3 m. Hier die Bilderschau auf Papier, 100 × 60 cm, mit ihrer Zeitleiste.',ru:'Экспорт в PDF, готовый для типографии, — от A3 до 100 × 140 см, свободные форматы до 3 м. Здесь стена картин на бумаге, 100 × 60 см, со шкалой времени.'},
   d:{en:['<b>Vector text</b>, images at print resolution, bleed included.','<b>Edition and signature line</b> for a numbered print.'],de:['<b>Schrift als Vektor</b>, Bilder in Druckauflösung, Beschnitt inklusive.','<b>Auflage und Signaturlinie</b> für einen nummerierten Druck.'],ru:['<b>Текст в векторе</b>, изображения в печатном разрешении, с вылетами.','<b>Тираж и линия для подписи</b> — для нумерованного оттиска.']}},
  {id:'papierdetail',w:5,oben:true,klein:{en:'Detail',de:'Ausschnitt',ru:'Фрагмент'},
   h:{en:'Readable to the last line.',de:'Lesbar bis zur letzten Zeile.',ru:'Читается до последней строки.'},
   p:{en:'Numbers in the cells, the same numbers in the list.',de:'Nummern in den Zellen, dieselben Nummern in der Liste.',ru:'Номера в ячейках — те же номера в списке.'},
   d:{en:['<b>Timeline</b>: one stroke per song on the day it was made.'],de:['<b>Zeitleiste</b>: ein Strich je Titel am Tag seiner Entstehung.'],ru:['<b>Шкала времени</b>: штрих для каждой песни в день её создания.']}},
  {id:'papier',w:8,oben:true,klein:{en:'Catalogue of works',de:'Werkverzeichnis',ru:'Каталог работ'},
   h:{en:'Every song with its number.',de:'Jeder Titel mit Nummer.',ru:'Каждая песня — со своим номером.'},
   p:{en:'The sound foam on paper, numbered, the full catalogue below.',de:'Der Klangschaum auf Papier, nummeriert, darunter das ganze Verzeichnis.',ru:'Звуковая пена на бумаге, с номерами, ниже — весь каталог.'},
   d:{en:['<b>Grouped by sound</b>, coloured by group, numbered area by area.'],de:['<b>Nach Klang gegliedert</b>, nach Gruppe gefärbt, Areal für Areal nummeriert.'],ru:['<b>По звучанию</b>, цвет по группе, нумерация по областям.']}},
  {id:'skizze',w:4,oben:true,klein:{en:'Sketchbook',de:'Skizzenbuch',ru:'Альбом эскизов'},
   h:{en:'In the manner of Leonardo.',de:'Im Stil Leonardos.',ru:'В манере Леонардо.'},
   p:{en:'The foam as pen drawings on parchment, with seal, studies and notes in the margin.',de:'Der Schaum als Federzeichnungen auf Pergament, mit Siegel, Studien und Randnotizen.',ru:'Пена как рисунки пером на пергаменте — с печатью, этюдами и заметками на полях.'},
   d:{en:['<b>One page of a sketchbook</b>: title, tabula, instrument studies, refrains.'],de:['<b>Eine Seite aus einem Skizzenbuch</b>: Titel, Tabula, Instrumentenstudien, Refrains.'],ru:['<b>Страница альбома</b>: заголовок, таблица, этюды инструментов, припевы.']}},
  {id:'vorlagen',w:12,oben:true,klein:{en:'Four looks',de:'Vier Anmutungen',ru:'Четыре стиля'},
   h:{en:'Gallery, paper, stained glass, mosaic.',de:'Galerie, Papier, Bleiglas, Mosaik.',ru:'Галерея, бумага, витраж, мозаика.'},
   p:{en:'Every detail adjustable afterwards: ground, joints, glass bands, shadow.',de:'Danach ist jede Feinheit einstellbar: Grund, Fugen, Glasbänder, Schatten.',ru:'Затем настраивается каждая деталь: фон, швы, стеклянные полосы, тень.'},
   d:{en:['<b>Images for social media</b> in 4:5, 1:1 and story format.'],de:['<b>Bilder für soziale Medien</b> in 4:5, 1:1 und im Story-Format.'],ru:['<b>Изображения для соцсетей</b> в форматах 4:5, 1:1 и сторис.']}}
  ]},
 {augenbraue:{en:'Create',de:'Gestalten',ru:'Создавать'},
  h:{en:'From cover to clip.',de:'Vom Cover zum Clip.',ru:'От обложки к клипу.'},
  p:{en:'With the effect clip studio, a still picture becomes a moving clip for Suno.',de:'Mit dem Effektclip-Studio wird aus einem stillen Bild ein bewegter Clip für Suno.',ru:'В студии эффект-клипов неподвижная картинка становится движущимся клипом для Suno.'},
  kacheln:[
  {id:'okkultbild',w:6,oben:true,klein:{en:'The picture',de:'Das Bild',ru:'Картинка'},
   h:{en:'A still cover.',de:'Ein stilles Titelbild.',ru:'Неподвижная обложка.'},
   p:{en:'The starting point: the title picture of “Okkultation”.',de:'Der Ausgangspunkt: das Titelbild von „Okkultation“.',ru:'Отправная точка — титульная картинка «Okkultation».'},
   d:{en:['<b>Any picture works:</b> a cover or one of your own.'],de:['<b>Jedes Bild geht:</b> ein Cover oder ein eigenes Bild.'],ru:['<b>Подходит любая картинка:</b> обложка или своя.']}},
  {id:'okkulttiefe',w:6,oben:true,klein:{en:'Depth map',de:'Tiefenkarte',ru:'Карта глубины'},
   h:{en:'Depth from a flat picture.',de:'Tiefe aus einem flachen Bild.',ru:'Глубина из плоской картинки.'},
   p:{en:'The software works out what is near and what is far. Bright is near.',de:'Die Software schätzt, was nah und was fern ist. Hell ist nah.',ru:'Программа оценивает, что близко, а что далеко. Светлое — близко.'},
   d:{en:['<b>Light, fog and focus</b> sit inside the scene instead of on top of it.'],de:['<b>Licht, Nebel und Schärfe</b> sitzen in der Szene statt darauf.'],ru:['<b>Свет, туман и резкость</b> находятся внутри сцены, а не поверх неё.']}},
  {id:'effektclip',w:8,oben:true,klein:{en:'Effect clip studio',de:'Effektclip-Studio',ru:'Студия эффект-клипов'},
   h:{en:'Bring a cover to life.',de:'Ein Cover zum Leben erwecken.',ru:'Оживи обложку.'},
   p:{en:'Five effects, one of them a camera move, in time with the music. As a loop for Suno.',de:'Fünf Effekte, einer davon eine Kamerafahrt, im Takt der Musik. Als Schleife für Suno.',ru:'Пять эффектов, один из них — движение камеры, в такт музыке. Как петля для Suno.'},
   d:{en:['<b>A light mixing desk</b> drives spotlights, lasers and pulses from the beat.','<b>Ken Burns with parallax.</b>','<b>Export a 10-second loop</b> to upload to Suno as a moving cover.'],
      de:['<b>Ein Lichtmischpult</b> steuert Scheinwerfer, Laser und Pulse aus dem Takt.','<b>Ken Burns mit Parallaxe.</b>','<b>Als 10-Sekunden-Schleife sichern</b> und bei Suno als Bewegtbild hochladen.'],
      ru:['<b>Световой пульт</b> управляет прожекторами, лазерами и импульсами по ритму.','<b>Кен Бёрнс с параллаксом.</b>','<b>Сохрани 10-секундную петлю</b> и загрузи её в Suno как видеообложку.']}},
  {id:'rezept',w:4,oben:true,klein:{en:'The recipe',de:'Das Rezept',ru:'Рецепт'},
   h:{en:'Five effects.',de:'Fünf Effekte.',ru:'Пять эффектов.'},
   p:{en:'There are 35 studio effects with 309 settings in all.',de:'Es gibt 35 Studioeffekte mit insgesamt 309 Einstellungen.',ru:'В студии 35 эффектов, всего 309 настроек.'},
   d:{en:['<b>Saved with the song</b> and repainted at any time.'],de:['<b>Beim Titel gespeichert</b> und jederzeit neu gemalt.'],ru:['<b>Хранится вместе с песней</b> и перерисовывается в любой момент.']}},
  ]},
 {augenbraue:{en:'On the sofa',de:'Auf dem Sofa',ru:'На диване'},
  h:{en:'Lean back with KlangTresor.',de:'Entspannen mit KlangTresor.',ru:'Отдыхай с KlangTresor.'},
  p:{en:'On the phone it becomes a music app. On the TV it becomes a stage.',de:'Auf dem Handy wird es zur Musik-App. Auf dem Fernseher zur Bühne.',ru:'На телефоне — музыкальное приложение. На телевизоре — сцена.'},
  kacheln:[
  {id:'abend',w:12,oben:true,klein:{en:'In the living room',de:'Im Wohnzimmer',ru:'В гостиной'},
   h:{en:'Lean back and listen.',de:'Zurücklehnen und hören.',ru:'Откинься и слушай.'},
   p:{en:'The vault runs at home. You listen wherever it is cosy.',de:'Der Tresor läuft zu Hause. Gehört wird, wo es gemütlich ist.',ru:'Сейф работает дома. Слушаешь там, где уютно.'},
   d:{en:['<b>Any phone in the home network</b> opens it in the browser, no app to install.'],de:['<b>Jedes Handy im Heimnetz</b> öffnet ihn im Browser, ohne App-Installation.'],ru:['<b>Любой телефон в домашней сети</b> открывает его в браузере, без установки приложения.']}},
  {id:'handys',w:12,oben:true,klein:{en:'Phone',de:'Handy',ru:'Телефон'},
   h:{en:'Made for one hand.',de:'Gemacht für eine Hand.',ru:'Создано для одной руки.'},
   p:{en:'Overview, stage, lyrics, Sound Space, foam, details and profile, in portrait or landscape.',de:'Übersicht, Bühne, Liedtexte, Klangraum, Schaum, Details und Profil, hochkant oder quer.',ru:'Обзор, сцена, тексты, звуковое пространство, пена, подробности и профиль — вертикально или горизонтально.'},
   d:{en:['<b>Everything else waits behind “⋯”:</b> shuffle, repeat, volume, equaliser, details.','<b>Sound, effect clip and poster studio</b> want a big screen and a mouse: any laptop in the home network.'],
      de:['<b>Alles Weitere wartet hinter „⋯“:</b> Zufall, Wiederholen, Lautstärke, Equalizer, Details.','<b>Ton-, Effektclip- und Plakat-Studio</b> wollen einen großen Schirm und eine Maus: jeder Laptop im Heimnetz.'],
      ru:['<b>Всё остальное — за «⋯»:</b> случайный порядок, повтор, громкость, эквалайзер, подробности.','<b>Звуковой студии, студиям эффект-клипов и плакатов</b> нужен большой экран и мышь: подойдёт любой ноутбук в домашней сети.']}},
  {id:'fernseher',w:12,oben:true,klein:{en:'TV',de:'Fernseher',ru:'Телевизор'},
   h:{en:'The stage, big.',de:'Die Bühne, groß.',ru:'Сцена — крупно.'},
   p:{en:'Mirror phone, tablet or laptop to the TV, and the lyrics run along.',de:'Handy, Tablet oder Laptop auf den Fernseher spiegeln, und der Liedtext läuft mit.',ru:'Выведи телефон, планшет или ноутбук на телевизор — и текст песни идёт вместе с музыкой.'},
   d:{en:['<b>Needs screen mirroring:</b> AirPlay (from Apple devices) or Google Cast (from Android and Chrome).','<b>In landscape the stage fills the screen</b> and the controls fade away.','<b>Karaoke readable from across the room.</b>'],
      de:['<b>Braucht Bildschirmspiegelung:</b> AirPlay (von Apple-Geräten) oder Google Cast (von Android und Chrome).','<b>Im Querformat füllt die Bühne den Schirm</b>, die Knöpfe blenden aus.','<b>Karaoke lesbar quer durchs Zimmer.</b>'],
      ru:['<b>Нужна трансляция экрана:</b> AirPlay (с устройств Apple) или Google Cast (с Android и Chrome).','<b>В горизонтальном режиме сцена занимает весь экран</b>, кнопки исчезают.','<b>Караоке читается через всю комнату.</b>']}},
  ]},
 {augenbraue:{en:'Stays yours',de:'Bleibt deins',ru:'Остаётся твоим'},
  h:{en:'A folder. Yours.',de:'Ein Ordner. Deiner.',ru:'Папка. Твоя.'},
  p:{en:'Back it up, move it, update the program. The archive stays.',de:'Sichern, umziehen, Programm aktualisieren. Das Archiv bleibt.',ru:'Сохрани, перенеси, обнови программу. Архив остаётся.'},
  kacheln:[
  {id:'sichern',w:8,oben:true,klein:{en:'Export',de:'Exportieren',ru:'Экспорт'},
   h:{en:'On a stick. For the car too.',de:'Auf einen Stick. Auch fürs Auto.',ru:'На флешку. И для машины.'},
   p:{en:'Your vault to take along: a frozen archive for playing, without the WAV originals. Double-click its start script and it runs on another Mac or Windows PC. Plus a Music folder: MP3s named by title, cover in the file, for car radio, TV and VLC.',de:'Dein Tresor zum Mitnehmen: ein eingefrorenes Archiv zum Abspielen, ohne die WAV-Originale. Doppelklick auf sein Startskript, und es läuft auf einem anderen Mac oder Windows-PC. Dazu ein Ordner Musik: MP3s nach Titel benannt, mit Cover in der Datei, für Autoradio, Fernseher und VLC.',ru:'Твой сейф с собой: замороженный архив для прослушивания, без оригиналов WAV. Двойной щелчок по скрипту запуска — и он работает на другом Mac или Windows-ПК. И папка «Musik»: MP3 по названиям, с обложкой в файле — для автомагнитолы, телевизора и VLC.'},
   d:{en:['<b>In stages:</b> the program and your newest songs first, instrument tracks last.','<b>Stop early</b> and you still have something to show.'],
      de:['<b>In Stufen:</b> erst das Programm und deine neuesten Titel, die Instrumentspuren zuletzt.','<b>Früh abbrechen</b>, und du hast trotzdem etwas Vorzeigbares.'],
      ru:['<b>По ступеням:</b> сначала программа и новые песни, инструментальные дорожки — в конце.','<b>Прервёшь раньше</b> — всё равно будет что показать.']}},
  {id:'offen',w:4,klein:{en:'Open source',de:'Quelloffen',ru:'Открытый код'},
   h:{en:'Free. MIT.',de:'Frei. MIT.',ru:'Свободно. MIT.'},
   p:{en:'On GitHub. A bell tells you when an update is out.',de:'Auf GitHub. Eine Glocke meldet, wenn ein Update da ist.',ru:'На GitHub. Колокольчик сообщает о выходе обновления.'},
   d:{en:['<b>Updating replaces the program</b>, never your archive.','<b>German, English, Russian.</b>','<b>Third-party parts keep their own licences.</b> The AI models for musical style are for non-commercial use only; details in web/fremd/LIZENZEN.md.'],
      de:['<b>Aktualisieren ersetzt das Programm</b>, nie dein Archiv.','<b>Deutsch, Englisch, Russisch.</b>','<b>Fremde Bausteine behalten ihre eigenen Lizenzen.</b> Die KI-Modelle zur Musikstil-Erkennung sind nur für nicht kommerzielle Nutzung frei; Einzelheiten in web/fremd/LIZENZEN.md.'],

function spracheWaehlen(){
  try { const s = localStorage.getItem('kt-features-sprache'); if (s && S.kopf.h[s]) return s; } catch(e){}

  for (const l of (navigator.languages || [navigator.language || 'en'])) { const k = (l||'').slice(0,2); if (S.kopf.h[k]) return k; }
  return 'en';
}
function bild(id, L){
  let q = BILDER[id];
  if (q && q.sprachen) q = q.sprachen[L] || q.sprachen.en;   /* Bild je Sprache, sonst Englisch */
  if (q && q.schaubild){ const g = q.schaubild;
    return `<div class="schaubild"><p class="sk l">${g.links[L]}</p><span></span><p class="sk r">${g.rechts[L]}</p>`
      + `<div class="sl l">${g.von[L].join('<br>')}</div>`
      + `<div class="sm"><i></i><div class="knopf"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></div><i></i><b>${g.knopf[L]}</b></div>`
      + `<div class="sl r">${g.bei[L].join('<br>')}</div></div>`; }
  if (q && q.liste) return `<div class="filterliste">${q.liste.map(g => `<p class="fk">${g.k[L]}</p><p class="fw">${g.w[L].join(' · ')}</p>`).join('')}</div>`;
  if (q && q.konsole) return `<div class="bild konsole"><div class="leiste"><i></i><i></i><i></i><span>KlangTresor</span></div><pre>${konsole(L).map(z => z.replace(/^  (KlangTresor (läuft|is running|работает))$/, '  <b>$1</b>').replace(/http:\/\/[^ ]+/g, '<u>$&</u>')).join('\n')}</pre></div>`;
  if (q && q.geraete){ const g = q.geraete;
    return `<div class="bild geraete"><div class="lap"><div class="schirm"><img src="${g.laptop}" alt=""></div><div class="fuss"></div></div>`
      + `<div class="tab"><img src="${g.tablet}" alt=""></div><div class="hand"><img src="${g.handy}" alt=""></div></div>`; }
  if (Array.isArray(q)) return `<div class="bild trip">${q.map(u => `<img src="${u}" alt="" loading="lazy">`).join('')}</div>`;
  if (!q) return `<div class="bild"><div class="platz">${S.kopf.platz[L]} · ${id}</div></div>`;
  if (/\.mp4(\?|$)/.test(q)) return `<div class="bild"><video src="${q}" autoplay muted loop playsinline data-tempo="${TEMPO[id] || 1}" onloadedmetadata="this.defaultPlaybackRate=this.playbackRate=+this.dataset.tempo"></video></div>`;
  return `<div class="bild"${FORMAT[id] ? ` style="aspect-ratio:${FORMAT[id]}"` : ''}><img src="${q}" alt="" loading="lazy"></div>`;
}
let L, KACHELN = {};
function bauen(){
  document.documentElement.lang = L;
  document.querySelectorAll('.sprache button').forEach(b => b.classList.toggle('an', b.dataset.l === L));
  KACHELN = {};
  let h = `<section class="held"><h1><span class="rad" aria-hidden="true"></span>${S.kopf.marke[L]}</h1><p class="spruch">${S.kopf.h[L]}</p><p>${S.kopf.p[L]}</p>${bild('titel', L)}</section>`;
  for (const a of S.abschnitte){
    h += `<section class="abschnitt"><div class="kopf"><p class="augenbraue">${a.augenbraue[L]}</p><h2>${a.h[L]}</h2><p>${a.p[L]}</p></div><div class="raster">`;
    for (const k of a.kacheln){
      KACHELN[k.id] = k;
      const zahl = k.zahl ? `<span class="zahl">${k.zahl.n}<small>${k.zahl.t[L]}</small></span>` : '';
      h += `<article class="k w${k.w}${k.quer ? ' quer' : ''}${k.oben ? ' oben' : ''}" data-id="${k.id}"><div class="text"><p class="klein">${k.klein[L]}</p><h3>${k.h[L]}</h3><p>${k.p[L]}</p>${zahl}<ul class="druck">${k.d[L].map(x => `<li>${x}</li>`).join('')}</ul></div>
        ${NUR_TEXT.has(k.id) ? '' : bild(k.id, L)}
        <button class="plus" data-k="${k.id}" aria-label="${S.kopf.mehr[L]}">${PLUS}</button></article>`;
    }
    h += `</div></section>`;
  }
  h += `<section class="grenzen"><h2>${S.grenzen.h[L]}</h2><ul>${S.grenzen.l[L].map(x => `<li>${x}</li>`).join('')}</ul></section>`;
  h += `<footer>${S.fuss[L]}${S.stern[L] ? `<br>${S.stern[L]}` : ''}</footer>`;
  document.getElementById('seite').innerHTML = h;
}
function auf(id){
  const k = KACHELN[id]; if (!k) return;
  document.getElementById('fenster').innerHTML = `<button class="zu" aria-label="${S.kopf.zu[L]}">${KREUZ}</button>

  document.getElementById('overlay').classList.add('auf');
  document.body.style.overflow = 'hidden';
  try { document.querySelector('#fenster .zu').focus({ preventScroll: true }); } catch (e) {}
}
function zu(){ document.getElementById('overlay').classList.remove('auf'); document.body.style.overflow = ''; }
document.addEventListener('click', e => {
  const p = e.target.closest('.plus'); if (p) return auf(p.dataset.k);
  if (e.target.closest('.zu') || e.target.id === 'overlay') zu();

  if (b){ L = b.dataset.l; try { localStorage.setItem('kt-features-sprache', L); } catch(e){} bauen(); }
});
