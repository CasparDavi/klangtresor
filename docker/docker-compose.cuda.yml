# Optional: NVIDIA-GPU für Whisper und den Klangraum.
# Caspars docker-compose.yml bleibt der Weg ohne Karte.
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.cuda.yml up -d --build
#   (aus dem Projektordner)
#
# Braucht das NVIDIA Container Toolkit. Ohne GPU diesen Overlay nicht
# verwenden — `gpus: all` hat keinen CPU-Rückfall, der Container startet
# dann oft gar nicht. Innerhalb des Images fällt Klangraum bei CUDA-Fehler
# trotzdem auf CPU zurück (KLANG_CUDA=1 in bin/klang.js).

services:
  klangtresor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cuda
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      KLANG_CUDA: "1"
      # whisper-cli liegt im Image unter /usr/local/bin (im Suchpfad), das Modell im Modellordner /app/modelle -
      # bis 28.10.2026 standen hier WHISPER_CLI und WHISPER_MODELL; bin/whisper.js liest sie nicht mehr.
    healthcheck:
      start_period: 600s
